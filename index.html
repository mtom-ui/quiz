<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17484d">
<meta name="app-version" content="0.6.1">
<title>Gambled Knowledge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2248%22%20fill%3D%22%23e07a67%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2241%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2211%22%20stroke-dasharray%3D%2212.9%2019.3%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2231%22%20fill%3D%22%23e07a67%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.5%22%20stroke-dasharray%3D%223%203%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2225%22%20fill%3D%22%23fff%22/%3E%3Ctext%20x%3D%2250%22%20y%3D%2262%22%20text-anchor%3D%22middle%22%20font-family%3D%22Georgia%2Cserif%22%20font-weight%3D%22700%22%20font-size%3D%2234%22%20fill%3D%22%2317484d%22%3E%3F%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --ink: #17484d;        /* Teal, Hauptfarbe */
    --ink-2: #0f3a3f;
    --coral: #e07a67;      /* Timer */
    --sel: #dcecec;        /* gewählte Antwort */
    --card: #ffffff;
    --line: #e6e0d9;
    --text: #1d2b2d;
    --muted: #7d8f90;
    --ok: #2b7a5b; --ok-bg: #d6ece1;
    --bad: #cf5a45; --bad-bg: #f8dcd5;
    --seg-off: #ddd6cf;
    --photo: #cfcfd2;      /* Avatar-Hintergrund (Grau des Avatar-Sheets) */
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }   /* kein Doppeltipp-Zoom beim schnellen Tippen */
  html, body { margin: 0; min-height: 100%; }
  body { font: 16px/1.4 var(--sans); color: var(--text); background: var(--ink); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  button:disabled { cursor: not-allowed; }

  /* ---------- Rahmen ---------- */
  .screen { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; background: var(--ink); animation: fade .25s ease; }
  .screen.noanim { animation: none; }
  .tile.pop { animation: pop .3s ease; }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (min-width: 600px) {
    body:not(.tv) { background: radial-gradient(1200px 700px at 20% 0%, #f1e3da, #e4d3c8 55%, #d9c6bb); padding: 24px; }
    body:not(.tv) .screen { min-height: calc(100dvh - 48px); border-radius: 36px; overflow: clip; box-shadow: 0 30px 70px -25px rgba(40, 20, 10, .45); }
  }
  .hero { color: #fff; padding: calc(14px + env(safe-area-inset-top)) 22px 34px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; min-height: 36px; font-size: 15px; opacity: .92; }
  .topbar .mid { text-align: center; flex: 1; }
  .iconbtn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 22px; line-height: 1; }
  .iconbtn:active { background: #ffffff22; }
  .iconbtn.ghost { visibility: hidden; }
  .meta { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 12px; font-size: 17px; opacity: .9; }
  .timer { background: var(--coral); color: #fff; border-radius: 14px; padding: 8px 16px; font-weight: 600; font-size: 19px; font-variant-numeric: tabular-nums; display: inline-flex; gap: 8px; align-items: center; }
  .timer.low { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); background: #e5634d; } }
  .q { font: 600 31px/1.14 var(--serif); margin: 0; letter-spacing: -.01em; }
  .big { font: 700 46px/1 var(--serif); letter-spacing: .14em; margin: 10px 0 2px; }
  .sub { opacity: .75; font-size: 14px; }

  .sheet { flex: 1; background: #fff; border-radius: 30px 30px 0 0; margin-top: -4px; padding: 22px 18px 0; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -10px 30px -12px rgba(0,0,0,.25); }
  .sheet > .grow { flex: 1; }
  .actions { position: sticky; bottom: 0; margin: 0 -18px; padding: 14px 18px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(#fff0, #fff 32%); display: flex; flex-direction: column; gap: 10px; }
  .btn { width: 100%; height: 58px; border-radius: 29px; background: var(--ink); color: #fff; font-weight: 600; font-size: 18px; transition: transform .12s, opacity .2s; }
  .btn:active:not(:disabled) { transform: scale(.98); }
  .btn:disabled { background: #a3b6b8; color: #fffffff0; }   /* undurchsichtig: die schwebende Leiste darf keinen Text darunter durchscheinen lassen */
  .btn.ghost:disabled { background: #fff; color: #a3b6b8; border-color: #c8d3d4; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--ink); }
  .btn.soft { background: var(--sel); color: var(--ink); }
  .btn.small { height: 44px; border-radius: 22px; font-size: 15px; }
  .btn.wait { opacity: .5; }
  .btn.danger { background: #fff; color: var(--bad); border: 1.5px solid var(--bad); }
  .link { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-size: 15px; text-align: center; padding: 6px; }

  /* ---------- Antworten ---------- */
  .answers { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .ans > span:not(.cnt):not(.voters) { min-width: 0; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; }   /* lange deutsche Wörter trennen statt Karte sprengen */
  .q { -webkit-hyphens: auto; hyphens: auto; overflow-wrap: break-word; }
  .ans { position: relative; text-align: left; background: #fff; border: 1.5px solid var(--line); border-radius: 20px; padding: 18px 14px; min-height: 66px; font-weight: 600; font-size: 17px; display: flex; gap: 6px; align-items: center; box-shadow: 0 6px 16px -10px rgba(23,72,77,.35); transition: all .15s; }
  .ans b { font-weight: 700; }
  .ans:active:not(:disabled) { transform: scale(.98); }
  .ans .chk { display: none; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); }
  .ans.sel { background: var(--sel); border-color: var(--ink); box-shadow: 0 10px 22px -10px rgba(23,72,77,.55); }
  .ans.sel .chk { display: block; }
  .ans.gone { opacity: .3; text-decoration: line-through; box-shadow: none; }
  .ans.right { background: var(--ok-bg); border-color: var(--ok); }
  .ans.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .ans .cnt { position: absolute; right: 10px; top: -9px; background: var(--ink); color: #fff; border-radius: 10px; font-size: 12px; padding: 1px 8px; font-weight: 600; }
  .ans:disabled { cursor: default; color: inherit; }

  /* ---------- Einsatz & Joker ---------- */
  .box { border: 1.5px solid var(--line); border-radius: 20px; padding: 14px; }
  .box h3 { margin: 0 0 8px; font: 600 13px var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .stake { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .stake .num { font: 700 44px/1 var(--serif); }
  .stake .of { color: var(--muted); font-size: 14px; }
  .round { width: 46px; height: 46px; border-radius: 50%; background: var(--sel); color: var(--ink); font-size: 26px; display: grid; place-items: center; }
  .round:active { transform: scale(.94); }
  input[type=range] { width: 100%; accent-color: var(--ink); margin: 12px 0 4px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1.5px solid var(--line); border-radius: 16px; padding: 6px 14px; font-size: 14px; font-weight: 600; background: #fff; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .jokers { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
  .jk { border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 2px 8px; text-align: center; font-size: 12px; font-weight: 600; position: relative; background: #fff; transition: all .15s; }
  .jk i { display: block; font-style: normal; font-size: 22px; margin-bottom: 2px; }
  .jk .n { position: absolute; top: -7px; right: -4px; background: var(--ink); color: #fff; border-radius: 9px; font-size: 11px; padding: 0 6px; }
  .jk.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .jk:disabled { opacity: .55; }
  .jk.on:disabled { opacity: 1; }
  .hint { font-size: 13px; color: var(--muted); }

  /* ---------- Fortschritt ---------- */
  .progress { text-align: center; }
  .progress .lbl { font-weight: 700; font-size: 15px; text-align: left; margin-bottom: 8px; }
  .progress .lbl span { font-weight: 400; color: var(--muted); }
  .segs { display: flex; gap: 3px; height: 28px; }
  .segs i { flex: 1; border-radius: 3px; background: var(--seg-off); }
  .segs i.on { background: var(--ink); }
  .progress .left { font-size: 14px; margin-top: 10px; }

  /* ---------- Avatare ---------- */
  .av { --s: 44px; width: var(--s); height: calc(var(--s) * 1.4583); border-radius: calc(var(--s) * .2); background: var(--photo); overflow: hidden; position: relative; flex: none; display: block; }
  .av img { position: absolute; width: 100%; left: 0; bottom: 0; display: block; }
  .av .ok { position: absolute; right: 4%; top: 4%; width: calc(var(--s) * .38); height: calc(var(--s) * .38); border-radius: 50%; background: var(--ok); color: #fff; font-size: calc(var(--s) * .24); display: grid; place-items: center; box-shadow: 0 0 0 2px #fff; }
  .avwrap { position: relative; flex: none; }
  .avfull { border-radius: 26px; background: var(--photo); overflow: hidden; aspect-ratio: 360 / 525; position: relative; }
  .avfull img { width: 100%; display: block; position: absolute; bottom: 0; left: 0; }
  .picker { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .pick { position: relative; aspect-ratio: 360 / 525; border-radius: 16px; padding: 0; border: 3px solid transparent; transition: transform .12s; }
  .pick .av { width: 100%; height: 100%; border-radius: 11px; }
  .pick.on { border-color: var(--ink); transform: scale(1.06); box-shadow: 0 8px 18px -8px rgba(23,72,77,.7); }
  .pick.taken { opacity: .28; }
  .pick.taken::after { content: "✕"; position: absolute; inset: 0; display: grid; place-items: center; color: #000; font-weight: 700; font-size: 22px; }
  .hero-av { width: 120px; margin: 0 auto; }

  /* ---------- Listen ---------- */
  .rows { display: flex; flex-direction: column; }
  .row { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .av { --s: 48px; }
  .row .rk { width: 22px; text-align: center; font-weight: 700; color: var(--muted); }
  .row .nm { flex: 1; min-width: 0; font-weight: 600; }
  .row .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
  .row .pts { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; }
  .row .pts small { display: block; font-size: 13px; }
  .row.me { background: linear-gradient(90deg, var(--sel), #fff0); margin: 0 -18px; padding-left: 18px; padding-right: 18px; }
  .pos { color: var(--ok); } .neg { color: var(--bad); } .zero { color: var(--muted); }
  .zbadge { font-size: 11px; background: var(--seg-off); border-radius: 8px; padding: 1px 7px; margin-left: 6px; font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .tile { text-align: center; position: relative; }
  .tile .av { --s: 76px; margin: 0 auto; }
  .tile .nm { font-weight: 600; font-size: 14px; line-height: 1.15; margin-top: 6px; overflow-wrap: anywhere; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile .st { font-size: 12px; color: var(--muted); }
  .tile .st.ready { color: var(--ok); font-weight: 600; }
  .tile .x { position: absolute; top: -4px; right: 6px; width: 24px; height: 24px; border-radius: 50%; background: var(--bad); color: #fff; font-size: 14px; }
  .qr { background: #fff; border: 1.5px solid var(--line); border-radius: 22px; padding: 14px; text-align: center; }
  .qr svg { width: 200px; height: 200px; display: block; margin: 0 auto; }
  .qr .url { font-size: 12px; color: var(--muted); word-break: break-all; margin-top: 6px; }
  .banner { border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 14px; }
  .banner.ok { background: var(--ok-bg); } .banner.bad { background: var(--bad-bg); } .banner.zero { background: #efeae4; }
  .banner .t { font: 700 24px/1.1 var(--serif); }
  .note { background: #f6f1ec; border-radius: 16px; padding: 12px 14px; font-size: 14px; }

  /* ---------- Formulare ---------- */
  label.f, h3.f { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .06em; }
  input.t, select.t { width: 100%; height: 54px; border-radius: 16px; border: 1.5px solid var(--line); padding: 0 16px; background: #fff; font-size: 18px; }
  input.t:focus, select.t:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 4px var(--sel); }
  input.code { text-transform: uppercase; letter-spacing: .3em; text-align: center; font: 700 30px var(--serif); }
  .seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg2 button { border: 1.5px solid var(--line); border-radius: 18px; padding: 14px 10px; font-weight: 600; text-align: center; }
  .seg2 button.on { border-color: var(--ink); background: var(--sel); }
  .seg2 small { display: block; font-weight: 400; color: var(--muted); }
  details.set { border: 1.5px solid var(--line); border-radius: 18px; padding: 4px 14px; }
  details.set summary { padding: 12px 0; font-weight: 600; cursor: pointer; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-bottom: 12px; }
  .grid2 input, .grid2 select { height: 44px; font-size: 16px; }

  /* ---------- Menü ---------- */
  .scrim { position: fixed; inset: 0; background: #0008; z-index: 20; display: flex; align-items: flex-end; justify-content: center; animation: fadeo .2s; }
  @keyframes fadeo { from { opacity: 0; } }
  .menu { background: #fff; width: 100%; max-width: 480px; border-radius: 28px 28px 0 0; padding: 20px 18px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; animation: up .25s ease; }
  @keyframes up { from { transform: translateY(40px); } }
  .menu h2 { margin: 0 0 4px; font: 600 22px var(--serif); }
  #toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #1d2b2d; color: #fff; padding: 12px 18px; border-radius: 16px; max-width: 92vw; z-index: 30; display: none; font-size: 15px; box-shadow: 0 10px 30px #0004; }
  #toast.err { background: var(--bad); }

  /* ---------- Sieger ---------- */
  .winner { text-align: center; }
  .winner .avfull { width: 150px; margin: 8px auto 12px; }
  .winner .name { font: 700 30px var(--serif); }
  .winner .pts { opacity: .8; }

  /* ---------- TV ---------- */
  body.tv { background: var(--ink); }
  body.tv .screen { max-width: none; margin: 0; }
  body.tv .hero { padding: 2.4vh 4vw 3.6vh; }
  body.tv .q { font-size: clamp(34px, 4.2vw, 60px); }
  body.tv .timer { font-size: 34px; padding: 12px 26px; border-radius: 20px; }
  body.tv .meta { font-size: 26px; }
  body.tv .sheet { padding: 3vh 4vw 0; gap: 2.6vh; }
  body.tv .actions { margin: 0 -4vw; padding: 1.6vh 4vw 2.4vh; flex-direction: row; }
  body.tv .ans { font-size: clamp(22px, 2.6vw, 34px); min-height: 100px; border-radius: 26px; padding: 22px; }
  body.tv .tiles { --tvk: 6; grid-template-columns: repeat(auto-fill, minmax(calc(var(--tvk) * 1vw + 16px), 1fr)); gap: 2.2vh 1.4vw; }
  body.tv .tile .av { --s: calc(var(--tvk) * 1vw); }
  body.tv .tile .nm { font-size: clamp(12px, calc(var(--tvk) * .22vw), 28px); margin-top: 8px; -webkit-line-clamp: 3; }
  body.tv .tile .st { font-size: clamp(14px, 1.1vw, 22px); }
  body.tv .tile .x { width: 34px; height: 34px; font-size: 20px; }
  body.tv .qr { padding: 22px; border-radius: 32px; }
  body.tv .qr svg { width: clamp(280px, min(24vw, 42vh), 560px); height: clamp(280px, min(24vw, 42vh), 560px); }
  body.tv .qr .url { font-size: clamp(14px, 1.1vw, 22px); margin-top: 12px; }
  body.tv .big { font-size: clamp(64px, min(7vw, 12vh), 150px); margin: .5vh 0 0; }
  body.tv .hero .sub { font-size: clamp(16px, 1.4vw, 28px); }
  body.tv .chip { font-size: clamp(15px, 1.2vw, 24px); padding: 8px 20px; }
  body.tv h3.f { font-size: clamp(15px, 1.2vw, 24px); }
  body.tv .lobby-cols { grid-template-columns: auto 1fr; gap: 3vw; }
  body.tv .row { padding: 14px 0; font-size: 22px; }
  body.tv .row .av { --s: 64px; }
  body.tv .rows { display: block; columns: 2; column-gap: 56px; }
  body.tv .row { break-inside: avoid; }
  /* Breite Bildschirme (Laptop/PC): Startablauf als zweispaltige Karte statt schmalem Handy-Streifen */
  @media (min-width: 900px) {
    body.start { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; padding: 32px; }
    body.start #app { width: 100%; }
    body.start .screen { max-width: 1080px; width: 100%; flex-direction: row; min-height: min(700px, calc(100dvh - 64px)); border-radius: 40px; margin: 0 auto; }
    body.start .hero { flex: 0 0 40%; padding: 40px 48px; display: flex; flex-direction: column; }
    body.start .hero .topbar { justify-content: flex-start; gap: 12px; }
    body.start .hero .topbar .mid { text-align: left; flex: none; }
    body.start .hero .q { font-size: 44px; margin-top: auto; }
    body.start .hero .sub { font-size: 17px; margin-top: 12px; margin-bottom: auto; }
    body.start .sheet { border-radius: 0; margin: 0; box-shadow: none; padding: 48px 56px 0; flex: 1; }
    body.start .sheet > * { width: 100%; max-width: 520px; }
    body.start .sheet { justify-content: center; align-items: flex-start; padding: 48px 56px; }
    body.start .sheet > .grow { display: none; }
    body.start .actions { position: static; margin: 8px 0 0; padding: 0; background: none; }
    body.start .picker { grid-template-columns: repeat(8, 1fr); gap: 8px; }
    body.start .hero-av { width: 130px; }
  }
  /* ---------- Tutorial ---------- */
  .tut-ic { width: 88px; height: 88px; border-radius: 28px; background: var(--sel); display: grid; place-items: center; font-size: 46px; margin: 4px auto 0; }
  .tut-body { font-size: 17px; line-height: 1.5; }
  .tut-body p { margin: 0 0 12px; }
  .tut-body .ex { background: #f6f1ec; border-radius: 16px; padding: 14px; margin: 0 0 12px; }
  .tut-body ul.tl { margin: 0 0 12px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .tut-body ul.tl li { background: #f6f1ec; border-radius: 14px; padding: 10px 12px; }
  .dots { display: flex; gap: 8px; justify-content: center; }
  .dots i { width: 8px; height: 8px; border-radius: 4px; background: var(--seg-off); transition: all .2s; }
  .dots i.on { background: var(--ink); width: 22px; }
  .twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
  @media (max-width: 900px) { .twocol { grid-template-columns: 1fr; } }

  /* ---------- 0.4.0: Erklärungen, Status, Animationen ---------- */
  .howto { display: flex; flex-direction: column; gap: 10px; margin: 4px 0 0; padding: 0; list-style: none; counter-reset: h; }
  .howto li { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; color: var(--text); }
  .howto li::before { counter-increment: h; content: counter(h); flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--sel); color: var(--ink); font-weight: 700; font-size: 14px; display: grid; place-items: center; }
  .status { border-radius: 18px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; background: #f6f1ec; font-size: 15px; }
  .status.ok { background: var(--ok-bg); }
  .status .ic { font-size: 24px; flex: none; }
  .status b { display: block; font-size: 16px; }
  details.invite { border: 1.5px solid var(--line); border-radius: 18px; padding: 0 14px; }
  details.invite summary { padding: 14px 0; font-weight: 600; cursor: pointer; }
  details.invite .qr { border: 0; padding: 0 0 14px; }
  details.invite .qr svg { width: 170px; height: 170px; }
  .tvjoin { margin-top: 18px; font-size: clamp(16px, 1.3vw, 26px); line-height: 1.45; }
  .tvjoin b { color: #f2c76a; }

<body>
<div id="app"></div>
<div id="toast"></div>
<script src="config.js"></script>
<script src="lib/qrcode.js"></script>
<script>
'use strict';
/* ====================================================================
   Quiz – Frontend (Iteration 2: Design)
   Der Browser hält KEINE Spiellogik. Er zeigt den öffentlichen Zustand
   (quiz_state) und die private Sicht des Spielers (quiz_my_state) und
   sendet Aktionen als RPC. Alles Verbindliche prüft der Server.
   ==================================================================== */
const CFG = window.QUIZ_CONFIG || {};
const APP_NAME = 'Gambled Knowledge';
const AVATARS = 15;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const ERR = {
  session_not_found: 'Diese Spielrunde gibt es nicht.', session_finished: 'Diese Runde ist bereits beendet.',
  session_full: 'Die Runde ist voll.', nickname_taken: 'Dieser Name ist schon vergeben.',
  avatar_taken: 'Diesen Avatar hat gerade jemand anderes gewählt.', invalid_avatar: 'Bitte einen Avatar wählen.',
  invalid_nickname: 'Bitte einen Namen mit 1–20 Zeichen eingeben.', not_enough_players: 'Es fehlen noch Spieler.',
  no_questions: 'Es sind keine aktiven Fragen in der Datenbank.',
  wrong_phase: 'Das geht gerade nicht (andere Phase).', too_late: 'Zu spät – die Zeit ist abgelaufen.',
  already_submitted: 'Du hast schon geantwortet.', invalid_stake: 'Ungültiger Einsatz.',
  invalid_answer: 'Bitte eine Antwort wählen.', question_changed: 'Die Frage hat gewechselt.',
  answer_removed: 'Diese Antwort wurde per 50:50 entfernt.', joker_not_available: 'Dieser Joker ist aufgebraucht.',
  joker_already_used: 'Joker schon in dieser Frage benutzt.', joker_limit_question: 'Pro Frage sind nicht mehr Joker erlaubt.',
  safety_net_needs_stake: 'Das Sicherheitsnetz braucht einen Einsatz über 0.', not_admin: 'Nur der Admin darf das.',
  skip_only_before_reveal: 'Überspringen geht nur vor der Auflösung.', question_not_in_session: 'Diese Frage gehört nicht zur Runde.',
  cannot_kick_admin: 'Der Admin kann nicht entfernt werden.', player_not_found: 'Dich gibt es in dieser Runde nicht mehr.',
};
const errText = e => ERR[e.message] || e.message || 'Unbekannter Fehler';

/* ---------- API ---------- */
async function rpc(fn, args) {
  const r = await fetch(`${CFG.url}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    // Neue Publishable-Keys (sb_publishable_…) sind keine JWTs und gehören nur in den apikey-Header.
    headers: { apikey: CFG.key, ...(String(CFG.key).startsWith('eyJ') ? { Authorization: `Bearer ${CFG.key}` } : {}), 'Content-Type': 'application/json' },
    body: JSON.stringify(args || {}),
  });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.message) || `HTTP ${r.status}`);
  return j;
}

/* ---------- Zustand ---------- */
let ID = null;          // Identität dieses Geräts: {sid, code, role, playerToken, playerId, adminToken}
let S = null;           // öffentlicher Zustand
let M = null;           // private Sicht (nur Spieler)
let offset = 0;         // Serverzeit - Gerätezeit (ms)
const prof = (() => { try { return JSON.parse(localStorage.getItem('quiz.profile')) || {}; } catch { return {}; } })();
let ui = { step: 'home', mode: 'phone', code: '', nick: prof.nick || '', avatar: prof.avatar || 0, taken: [], settingsOpen: window.innerWidth >= 900, solo: false, tutOpen: false, tutStep: 0,
  menu: false, confirm: null, ask: null, reason: '', stake: 1, answer: null, joker: '', arm: '', sv: {}, takenNames: [] };
let pool = null;
let lastStatus = null, lastKey = '', lastQ = null, seenEvent = null, busy = false, lastPoke = 0, rt = null;

const save = () => { try { sessionStorage.setItem('quiz.id', JSON.stringify(ID)); localStorage.setItem('quiz.last', JSON.stringify(ID)); } catch {} };
const saveProfile = () => { try { localStorage.setItem('quiz.profile', JSON.stringify({ nick: ui.nick, avatar: ui.avatar })); } catch {} };
const loadId = () => { try { return JSON.parse(sessionStorage.getItem('quiz.id')); } catch { return null; } };
const loadLast = () => { try { return JSON.parse(localStorage.getItem('quiz.last')); } catch { return null; } };
function leave() {
  ID = S = M = null; lastKey = ''; ui.step = 'home'; ui.menu = false; ui.confirm = null;
  try { sessionStorage.removeItem('quiz.id'); localStorage.removeItem('quiz.last'); } catch {}
  if (rt) { rt.close(); rt = null; }
  if (wake) { wake.release().catch(() => {}); wake = null; }
  history.replaceState(null, '', location.pathname);
  render(true);
}

const isTV = () => ID && ID.role === 'tv';
const isAdmin = () => ID && !!ID.adminToken;
const me = () => S && ID && S.players.find(p => p.id === ID.playerId);
const joinUrl = () => `${location.origin}${location.pathname}?code=${S ? S.code : ID.code}`;
const pl = id => (S && S.players.find(p => p.id === id)) || null;

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), err ? 4500 : 3200);
}
async function act(fn, after) {
  try { const r = await fn(); if (after) after(r); await refresh(true); return r; }
  catch (e) { toast(errText(e), true); await refresh(true).catch(() => {}); }
}

/* ---------- Laden / Synchronisieren ---------- */
async function refresh(force) {
  if (!ID || busy && !force) return;
  busy = true;
  try {
    const [s, m] = await Promise.all([
      rpc('quiz_state', { p_session_id: ID.sid }),
      ID.playerToken ? rpc('quiz_my_state', { p_player_token: ID.playerToken }) : null,
    ]);
    offset = Date.parse(s.server_now) - Date.now();
    S = s; M = m;
    if (S.status !== lastStatus) { ui.ask = null; lastStatus = S.status; }
    if (S.status === 'question_active' && S.question && lastQ !== S.question.sq_id) {
      lastQ = S.question.sq_id; ui.ask = null; ui.answer = null; ui.joker = ''; ui.confirm = null; ui.reason = ''; ui.menu = false;
      ui.stake = Math.min(1, maxStake());
    }
    netState(true);
    handleEvent();
    render();
  } catch (e) {
    if (e.message === 'session_not_found' || e.message === 'player_not_found') { toast(errText(e), true); leave(); }
    else netState(false);
  } finally { busy = false; }
}
/* Verbindungsanzeige: erst nach zwei Fehlversuchen in Folge, damit ein einzelner Aussetzer nicht nervt */
let netFails = 0;
function netState(ok) {
  netFails = ok ? 0 : netFails + 1;
  let pill = $('#netpill');
  if (netFails >= 2 && !pill) { document.body.insertAdjacentHTML('beforeend', '<div class="netpill" id="netpill">Keine Verbindung – versuche es erneut …</div>'); }
  if (ok && pill) { pill.remove(); toast('Wieder verbunden'); }
}
/* Bildschirm während einer Runde nicht abdunkeln lassen (wo der Browser es unterstützt) */
let wake = null;
async function keepAwake() {
  if (!ID || wake || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
  try { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => (wake = null)); } catch {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && ID) { refresh(true); keepAwake(); } });
function handleEvent() {
  const ev = S.last_event;
  if (!ev) return;
  if (seenEvent === null) { seenEvent = ev.at; return; }
  if (ev.at === seenEvent) return;
  seenEvent = ev.at;
  const txt = { skipped: 'Der Admin hat die Frage übersprungen – keine Punkte, kein Joker verbraucht.',
    blocked: 'Der Admin hat die Frage dauerhaft gesperrt und übersprungen.',
    blocked_after_reveal: 'Der Admin hat die vorige Frage dauerhaft gesperrt.',
    ended: 'Der Admin hat das Spiel beendet.' }[ev.type];
  if (txt) toast(txt);
}

/* Minimaler Supabase-Realtime-Client (Phoenix-Protokoll). Löst nur ein Neuladen aus;
   ohne Realtime sorgt das Polling weiterhin für Synchronisierung. */
function connectRealtime() {
  if (CFG.dev || !ID || rt) return;
  let ws, ref = 0, hb;
  try { ws = new WebSocket(`${CFG.url.replace(/^http/, 'ws')}/realtime/v1/websocket?apikey=${encodeURIComponent(CFG.key)}&vsn=1.0.0`); } catch { return; }
  rt = { ws, ok: false, close() { clearInterval(hb); try { ws.close(); } catch {} } };
  const send = (topic, event, payload) => ws.send(JSON.stringify({ topic, event, payload, ref: String(++ref) }));
  ws.onopen = () => {
    send(`realtime:quiz-${ID.sid}`, 'phx_join', { config: {
      broadcast: { ack: false, self: false }, presence: { key: '' }, private: false,
      postgres_changes: [{ event: '*', schema: 'public', table: 'quiz_sessions', filter: `id=eq.${ID.sid}` }] },
      access_token: CFG.key });
    hb = setInterval(() => send('phoenix', 'heartbeat', {}), 25000);
  };
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.event === 'phx_reply' && m.payload && m.payload.status === 'ok' && m.topic.startsWith('realtime:')) rt.ok = true;
    if (m.event === 'postgres_changes') refresh(true);
  };
  ws.onclose = () => { clearInterval(hb); rt = null; if (ID) setTimeout(connectRealtime, 3000); };
  ws.onerror = () => {};
}

/* Takt: Countdown anzeigen, abgelaufene Fristen beim Server anstoßen, Polling */
const secsLeft = dl => (Date.parse(dl) - (Date.now() + offset)) / 1000;
const barScale = () => Math.max(0, Math.min(1, secsLeft(S.deadline) / S.settings.answer_seconds));
const mmss = sec => { sec = Math.max(0, Math.ceil(sec)); return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); };
setInterval(() => {
  if (!S) return;
  const t = $('#tt'), box = $('#timer');
  const now = Date.now() + offset;
  if (S.status === 'question_active' && S.deadline) {
    const left = (Date.parse(S.deadline) - now) / 1000;
    if (t) t.textContent = mmss(left);
    if (box) box.classList.toggle('low', left <= 10 && left > 0);
    const bar = $('#tbar'); if (bar) bar.style.transform = `scaleX(${barScale()})`;
    if (left < -(S.settings.grace_ms / 1000) - 0.3 && Date.now() - lastPoke > 1000) { lastPoke = Date.now(); refresh(true); }
  } else if (S.status === 'reveal' && S.ready_deadline) {
    const left = (Date.parse(S.ready_deadline) - now) / 1000;
    if (t) t.textContent = mmss(left);
    if (left < -0.3 && Date.now() - lastPoke > 1000) { lastPoke = Date.now(); refresh(true); }
  }
}, 250);
setInterval(() => { if (ID) refresh(); }, 1500);

let pendingSettings = {};
async function joinNext(fromLink) {  // Schritt 1 Beitreten: Code prüfen, vergebene Avatare laden
  const code = (fromLink || val('code')).trim().toUpperCase();
  if (code.length < 5) return toast('Bitte den 5-stelligen Code eingeben.', true);
  try {
    const s = await rpc('quiz_state_by_code', { p_code: code });
    if (s.status === 'finished') throw new Error('session_finished');
    ui.code = code; ui.taken = s.players.map(p => p.avatar).filter(Boolean); ui.mode = 'join';
    ui.takenNames = s.players.map(p => p.nickname.toLowerCase());

  } catch (e) { toast(errText(e), true); if (fromLink) { ui.step = 'join'; render(true); } }
}
/* Gemerkten Avatar behalten, wenn frei – sonst einen freien zufällig vorschlagen (man kann sofort beitreten) */
function pickFreeAvatar() {
  if (ui.avatar && !ui.taken.includes(ui.avatar)) return;
  const free = Array.from({ length: AVATARS }, (_, i) => i + 1).filter(n => !ui.taken.includes(n));
  ui.avatar = free.length ? free[Math.floor(Math.random() * free.length)] : 0;
}
function createNext(mode) {           // Schritt 1 Erstellen: Einstellungen merken

}
function nickHint() {

}
async function submitProfile() {

  saveProfile();
  if (ui.mode === 'join') return joinGame();
  return createGame('phone');
}
async function createGame(mode) {
  try {
    const r = await rpc('quiz_create_session', { p_mode: mode, p_nickname: mode === 'phone' ? ui.nick : null,
      p_admin_plays: mode === 'phone', p_settings: pendingSettings, p_avatar: mode === 'phone' ? ui.avatar : null });

      playerToken: r.player_token, playerId: r.player_id, adminToken: r.admin_token };

async function joinGame() {

    save(); startSync(); history.replaceState(null, '', location.pathname);
  } catch (e) {

    if (e.message === 'avatar_taken') { try { const s = await rpc('quiz_state_by_code', { p_code: ui.code }); ui.taken = s.players.map(p => p.avatar).filter(Boolean); ui.avatar = 0; render(true); } catch {} }

async function watchTV() {            // nur zuschauen (ohne Spielerrolle), z. B. zweiter Bildschirm

/* ---------- Aktionen im Spiel ---------- */

  ready: on => act(() => rpc('quiz_set_ready', { p_player_token: ID.playerToken, p_ready: on })),
  start: () => act(() => rpc('quiz_start', { p_admin_token: ID.adminToken })),

    act(() => rpc('quiz_submit', { p_player_token: ID.playerToken, p_sq_id: S.question.sq_id,

  },

  end: () => { ui.menu = false; ui.confirm = null; act(() => rpc('quiz_admin_end', { p_admin_token: ID.adminToken })); },

const setMenu = on => { ui.menu = on; ui.confirm = null; render(true); };
const setConfirm = c => { ui.confirm = c; render(true); };
const pick = l => { ui.answer = l; document.querySelectorAll('.ans[data-l]').forEach(b => b.classList.toggle('sel', b.dataset.l === l)); submitLabel(); };
const submitTxt = () => !ui.answer ? 'Erst eine Antwort wählen' : `${ui.answer} bestätigen · ${ui.stake} ${ui.stake === 1 ? 'Punkt' : 'Punkte'}${ui.joker ? ' · ' + JK[ui.joker][0] : ''}`;
function submitLabel() { const b = $('#submitBtn'); if (b) { b.textContent = submitTxt(); b.classList.toggle('wait', !ui.answer); } }
/* Höchsteinsatz: Deckel der Runde (max_stake, 0 = unbegrenzt), nie mehr als die eigenen Punkte */
const stakeCap = () => { const c = S && S.settings ? Number(S.settings.max_stake) || 0 : 0; return c > 0 ? c : Infinity; };
const maxStake = () => Math.min(M ? M.points : 0, stakeCap());
const setStake = v => {
  const max = maxStake();
  ui.stake = Math.max(0, Math.min(max, Math.round(Number(v) || 0)));
  if (ui.stake === 0 && ui.joker === 'safety_net') { ui.joker = ''; document.querySelectorAll('[data-jkey=safety_net]').forEach(b => b.classList.remove('on')); }
  const sv = $('#stakeVal'), sr = $('#stakeRange'); rollNum(sv, ui.stake); if (sr) sr.value = ui.stake;
  updateChips(ui.stake);
  syncJokers();
  document.querySelectorAll('[data-chip]').forEach(c => c.classList.toggle('on', Number(c.dataset.chip) === ui.stake));
  submitLabel();
};
const setJoker = j => { ui.joker = ui.joker === j ? '' : j; document.querySelectorAll('[data-jkey=han_solo],[data-jkey=safety_net]').forEach(b => b.classList.toggle('on', b.dataset.jkey === ui.joker)); syncJokers(); submitLabel(); };
function selAvatar(n) {

/* ---------- Bausteine ---------- */
const avSrc = n => `avatars/a${String(n).padStart(2, '0')}.jpg`;
const av = (n, s = 0, extra = '') => `<span class="av"${s ? ` style="--s:${s}px"` : ''}>${n ? `<img src="${avSrc(n)}" alt="" draggable="false">` : ''}${extra}</span>`;
const avFull = n => `<div class="avfull">${n ? `<img src="${avSrc(n)}" alt="">` : ''}</div>`;
const CHIP_LOGO = '<svg aria-hidden="true" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#e07a67"/><circle cx="50" cy="50" r="41" fill="none" stroke="#fff" stroke-width="11" stroke-dasharray="12.9 19.3"/><circle cx="50" cy="50" r="31" fill="#e07a67" stroke="#fff" stroke-width="2.5" stroke-dasharray="3 3"/><circle cx="50" cy="50" r="25" fill="#fff"/><text x="50" y="62" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="34" fill="#17484d">?</text></svg>';
const chipIco = () => '<svg class="chipi" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#e07a67"/><circle cx="50" cy="50" r="40" fill="none" stroke="#fff" stroke-width="14" stroke-dasharray="12.6 18.8"/><circle cx="50" cy="50" r="24" fill="#fff"/></svg>';
/* Chipstapel für einen Einsatz: Stapel zu 10 / 5 / 1, wachsen und schrumpfen animiert */
const CHIP_MAX = 7;
function chipSplit(v) { const t = Math.floor(v / 10), f = Math.floor((v % 10) / 5); return [[10, t], [5, f], [1, v % 5]]; }
function chipStacksHtml(v) {
  return `<div class="stacks" id="chipStacks">${chipSplit(v).map(([d, n]) => `<div class="stk" data-d="${d}">${Array.from({ length: Math.min(n, CHIP_MAX) }, (_, i) => `<i class="pc c${d}" style="bottom:${i * 7}px;--k:${i}"></i>`).join('')}${n > CHIP_MAX ? `<span class="more">×${n}</span>` : ''}</div>`).join('').replace(/<div class="stk" data-d="(\d+)"><\/div>/g, '<div class="stk" data-d="$1" hidden></div>')}</div>`;
}
function updateChips(v, box = $('#chipStacks')) {
  if (!box) return;
  chipSplit(v).forEach(([d, n]) => {
    const stk = box.querySelector(`[data-d="${d}"]`); if (!stk) return;
    const want = Math.min(n, CHIP_MAX), have = [...stk.querySelectorAll('.pc:not(.off)')];
    if (want) stk.hidden = false;
    for (let i = have.length; i < want; i++) stk.insertAdjacentHTML('beforeend', `<i class="pc c${d} drop" style="bottom:${i * 7}px;--k:${i};animation-delay:${(i - have.length) * 35}ms"></i>`);
    have.slice(want).forEach(e => { e.classList.add('off'); setTimeout(() => { e.remove(); if (!stk.querySelector('.pc')) stk.hidden = true; }, 220); });
    let m = stk.querySelector('.more'); if (n > CHIP_MAX) { if (!m) stk.insertAdjacentHTML('beforeend', '<span class="more"></span>'); stk.querySelector('.more').textContent = '×' + n; } else if (m) m.remove();
  });
}
/* Rollende Ziffern */
function rollNum(el, v) {
  if (!el) return;
  const str = String(v);
  if (calm()) { el.textContent = str; return; }
  if (!el.classList.contains('roll') || el.children.length !== str.length) {
    el.classList.add('roll');
    el.innerHTML = [...str].map(() => `<span class="col">${'0123456789'.split('').map(x => `<span>${x}</span>`).join('')}</span>`).join('');
    void el.offsetWidth;
  }
  [...str].forEach((ch, i) => (el.children[i].style.transform = `translateY(-${Number(ch)}em)`));
  el.setAttribute('aria-label', str);
}
/* Partikel: kleine Chips fliegen aus einem Punkt heraus */
function burst(x, y, n = 14) {
  if (calm()) return;
  const cols = ['#e07a67', '#e9b949', '#17484d', '#7fc4c4'];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, r = 50 + Math.random() * 90, e = document.createElement('i');
    e.className = 'burst';
    e.style.cssText = `left:${x}px;top:${y}px;--c:${cols[i % cols.length]};--x:${Math.cos(a) * r}px;--y:${Math.sin(a) * r - 30}px;--r:${(Math.random() - .5) * 720}deg`;
    document.body.appendChild(e); setTimeout(() => e.remove(), 800);
  }
}
const burstFrom = el => { if (!el) return; const b = el.getBoundingClientRect(); burst(b.left + b.width / 2, b.top + b.height / 2); };
/* Tipp-Welle */
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.btn, .chip'); if (!b || b.disabled || calm()) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.2, w = document.createElement('span');
  w.className = 'rip'; w.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
  b.appendChild(w); setTimeout(() => w.remove(), 600);
}, { passive: true });
const CHECK = '<svg class="chk" width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="11" fill="#17484d"/><path d="M6 11.5l3.2 3.2L16 7.8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const dots = '<svg width="22" height="6" viewBox="0 0 22 6" fill="#fff"><circle cx="3" cy="3" r="2.6"/><circle cx="11" cy="3" r="2.6"/><circle cx="19" cy="3" r="2.6"/></svg>';
const sgn = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n);

function qrSvg(text) {
  try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ scalable: true, margin: 0 }); }
  catch { return '<p class="hint">QR-Code nicht verfügbar – bitte Link oder Code verwenden.</p>'; }
}

  else if (ui.confirm === 'end') h = `<h2>Spiel für alle beenden?</h2><button class="btn danger" onclick="A.end()">Ja, beenden</button><button class="btn ghost" onclick="setConfirm(null)">Abbrechen</button>`;

const tvkFor = n => n <= 4 ? 9.2 : n <= 8 ? 7.4 : n <= 12 ? 6.3 : 4.6;
const tileStatus = p => [ID && p.id === ID.playerId ? 'du' : '', p.is_admin ? 'Admin' : p.is_ready ? '✓ bereit' : 'wartet …'].filter(Boolean).join(' · ');
const tileHtml = p => `<div class="tile" data-pid="${p.id}">${av(p.avatar)}
      <div class="nm">${esc(p.nickname)}</div>
      <div class="st ${p.is_ready ? 'ready' : ''}">${tileStatus(p)}</div>
      ${isAdmin() && !p.is_admin ? `<button class="x" aria-label="entfernen" onclick="askKick('${p.id}')">×</button>` : ''}</div>`;
/* Lobby ohne Neuzeichnen aktualisieren: Kacheln einfügen/entfernen/umsortieren, Status ändern.
   Bilder bleiben im DOM – es flackert nichts, wenn andere beitreten oder „bereit“ drücken. */
function patchLobby() {
  const box = $('#tiles'); if (!box) return;
  const have = new Map([...box.children].map(e => [e.dataset.pid, e]));
  S.players.forEach((p, i) => {
    let el = have.get(p.id);
    if (!el) { box.insertAdjacentHTML('beforeend', tileHtml(p)); el = box.lastElementChild; el.classList.add('pop'); }
    else {
      have.delete(p.id);
      const st = el.querySelector('.st'), t = tileStatus(p);
      if (st.textContent !== t) st.textContent = t;
      st.classList.toggle('ready', !!p.is_ready);
    }
    const cur = box.children[i]; if (cur !== el) box.insertBefore(el, cur || null);
  });
  have.forEach(e => e.remove());
  const c = $('#pcount'); if (c) c.textContent = lobbyCount();
  const sc = $('#lobbyStatus'); if (sc) { const h = lobbyStatus(); if (sc.innerHTML !== h) sc.innerHTML = h; if (isAdmin()) sc.classList.toggle('ok', !notReady().length && S.players.length >= S.settings.min_players); }
  const sb2 = $('#startBtn'); if (sb2) sb2.textContent = startLabel();
  box.style.setProperty('--tvk', tvkFor(S.players.length));
  const need = S.settings.min_players, sb = $('#startBtn'), sh = $('#startHint');
  if (sb) sb.disabled = S.players.length < need;
  if (sh) sh.hidden = S.players.length >= need;
}

const notReady = () => S.players.filter(p => !p.is_admin && !p.is_ready);
const lobbyCount = () => { const r = S.players.filter(p => p.is_admin || p.is_ready).length; return `${S.players.length} Spieler · ${r} bereit`; };
const startLabel = () => { const n = notReady().length; return n ? `Spiel starten (${n} noch nicht bereit)` : 'Spiel starten – alle bereit'; };
const adminName = () => { const a = S.players.find(p => p.is_admin); return a ? esc(a.nickname) : 'der Admin'; };
function lobbyStatus() {
  const m = me();

/* Rückfragen (Start trotz nicht bereiter Spieler, Spieler entfernen) */
function askKick(id) { const p = pl(id); ui.ask = { type: 'kick', id, name: p ? p.nickname : '' }; render(true); }

/* ---------- Tutorial (vor dem „Bereit“) ---------- */
const tutKey = () => 'quiz.tut.' + (ID ? ID.sid : '');
const tutSeen = () => { try { return !!sessionStorage.getItem(tutKey()); } catch { return true; } };
const tutActive = () => !!(ID && S && S.status === 'lobby' && ID.playerToken && !isTV() && (ui.tutOpen || !tutSeen()));
function tutOpen() { ui.tutOpen = true; ui.tutStep = 0; render(true); window.scrollTo(0, 0); }
function tutGo(d) { ui.tutStep = Math.max(0, Math.min(tutSteps().length - 1, ui.tutStep + d)); render(true); window.scrollTo(0, 0); }
function tutDone() { try { sessionStorage.setItem(tutKey(), '1'); } catch {} ui.tutOpen = false; ui.tutStep = 0; render(true); window.scrollTo(0, 0); }
function tutSteps() {
  const c = S.settings, j = c.jokers, sp = c.start_points, tmax = Number(c.max_stake) > 0 ? Math.min(sp, c.max_stake) : sp, ex = Math.max(1, Math.round(tmax * .4));
  return [
    { icon: '🎲', title: 'So läuft ein Spiel', body: `<p>Alle spielen gleichzeitig, jeder auf dem eigenen Handy. Es gibt <b>${c.question_count} Fragen</b> mit je vier Antworten und <b>${c.answer_seconds} Sekunden</b> Zeit.</p><p class="hint" style="margin:0 0 6px">Beispiel: Was ist die Hauptstadt von Italien?</p><div class="mock"><span>A. Mailand</span><span class="sel">B. Rom ✓</span><span>C. Neapel</span><span>D. Turin</span></div><p>Du startest mit <b>${sp} Punkten</b>. Wer am Ende die meisten hat, gewinnt.</p>` },
    { icon: '🎯', title: 'Dein geheimer Einsatz', body: `<p>Bei jeder Frage setzt du Punkte – ${Number(c.max_stake) > 0 ? `von 0 bis höchstens <b>${c.max_stake}</b> (und nie mehr, als du hast)` : 'von 0 bis alle, die du hast'}. Die anderen sehen deinen Einsatz erst bei der Auflösung.</p>
      <div class="try"><b>Probier's aus:</b> Du hast ${sp} Punkte und setzt <b class="ticker" id="tryV">${ex}</b>.
        <input type="range" min="0" max="${tmax}" value="${ex}" oninput="tutTry(this.value, ${sp})" aria-label="Beispiel-Einsatz">
        ${chipStacksHtml(ex).replace('id="chipStacks"', 'id="tryStack"')}
        <div class="res"><span>Richtig → <b class="pos" id="tryW">${sp + ex}</b></span><span>Falsch → <b class="neg" id="tryL">${sp - ex}</b></span></div></div>
      <p>Bist du dir sicher, setz viel. Bist du unsicher, setz wenig oder 0 – dann kannst du nichts verlieren.</p>` },
    { icon: '✅', title: 'Antworten & bestätigen', body: `<ul class="tl"><li><b>1.</b> Antwort antippen</li><li><b>2.</b> Einsatz mit <b>−</b> / <b>+</b> einstellen</li><li><b>3.</b> Unten auf <b>Bestätigen</b> tippen – danach ist alles endgültig</li></ul><p>Läuft die Zeit ab, bevor du bestätigst, zählt die Frage als falsch – aber ohne Einsatz, du verlierst also nichts.</p>` },
    { icon: '🃏', title: 'Joker', body: `<p>Jeden Joker hast du nur begrenzt – setz ihn klug ein.</p><ul class="tl"><li><b>½ 50:50</b> – zwei falsche Antworten verschwinden (${j.fifty_fifty}× pro Spiel)</li><li><b>👥 Gruppe</b> – du siehst, was die anderen bisher gewählt haben (${j.group_opinion}×)</li><li><b>⭐ Han Solo</b> – +${c.han_solo_bonus} Bonuspunkte, wenn <i>nur du</i> richtig liegst, ab ${c.han_solo_min_players} Spielern (${j.han_solo}×)</li><li><b>🛟 Netz</b> – liegst du falsch, verlierst du nur die Hälfte deines Einsatzes (${j.safety_net}×)</li></ul><p class="hint">50:50 und Gruppe wirken sofort (nach kurzer Rückfrage). Han Solo und Netz werden zusammen mit der Antwort abgeschickt. Angezeigt werden nur Joker, die du gerade nutzen kannst – höchstens ${c.max_jokers_per_question} pro Frage.</p>` },
    { icon: '🏆', title: 'Auflösung & Rangliste', body: `<p>Nach jeder Frage siehst du sofort, ob du richtig lagst, wer was gewählt hat und wie sich die Rangliste verändert.</p><p>Tippe dann auf <b>Weiter</b> – die nächste Frage kommt, sobald alle bereit sind.</p><p class="hint">Mit 0 Punkten bist du nicht raus: Du spielst ohne Einsatz weiter mit.</p>` },
  ];
}
function tutTry(v, sp) { v = Number(v); $('#tryV').textContent = v; updateChips(v, $('#tryStack')); $('#tryW').textContent = sp + v; $('#tryL').textContent = sp - v; }
/* Wischen im Tutorial (links = weiter, rechts = zurück) */
let swipeX = null;
document.addEventListener('touchstart', e => { swipeX = tutActive() && e.target.type !== 'range' ? e.touches[0].clientX : null; }, { passive: true });
document.addEventListener('touchend', e => {
  if (swipeX === null || !tutActive()) return;
  const dx = e.changedTouches[0].clientX - swipeX; swipeX = null;
  if (Math.abs(dx) > 60) { if (dx < 0 && ui.tutStep < tutSteps().length - 1) tutGo(1); else if (dx > 0 && ui.tutStep > 0) tutGo(-1); }
}, { passive: true });
function tutorialView() {
  const steps = tutSteps(), i = Math.min(ui.tutStep, steps.length - 1), st = steps[i], last = i === steps.length - 1;
  return `<div class="screen"><div class="hero"><div class="topbar"><span style="width:96px"></span><div class="mid">Spielanleitung</div><button class="link" style="color:#fff;width:96px;font-size:14px;text-align:right" onclick="tutDone()">Überspringen</button></div>
    <div class="meta" style="margin-top:18px"><span>Schritt ${i + 1} von ${steps.length}</span></div><h1 class="q">${st.title}</h1></div>
    <div class="sheet"><div class="tut-ic">${st.icon}</div><div class="tut-body">${st.body}</div>
      <div class="dots">${steps.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div><div class="grow"></div>
      <div class="actions">${last ? '<button class="btn" onclick="tutDone()">Verstanden – los geht\'s</button>' : '<button class="btn" onclick="tutGo(1)">Weiter</button>'}${i > 0 ? '<button class="btn ghost" onclick="tutGo(-1)">Zurück</button>' : ''}</div></div></div>`;
}

  const status = `<div class="status ${(m && m.is_ready) || (isAdmin() && !notReady().length && S.players.length >= need) ? 'ok' : ''}" id="lobbyStatus">${lobbyStatus()}</div>`;

const ownResult = () => S.reveal && ID && S.reveal.results.find(r => r.player_id === ID.playerId);
function answerList(mode) {   // 'pick' | 'locked' | 'reveal'
  const used = (M && M.jokers_this_question) || {};
  const removed = used.fifty_fifty ? used.fifty_fifty.removed : [];
  const gm = used.group_opinion;
  const sub = M && M.submission;
  const mine = mode === 'reveal' ? ownResult() : null;
  const voters = mode === 'reveal' ? S.reveal.results.reduce((o, r) => { if (r.answer) (o[r.answer] = o[r.answer] || []).push(r.player_id); return o; }, {}) : {};
  return `<div class="answers">${['A', 'B', 'C', 'D'].map((l, i) => {
    let cls = 'ans', dis = mode === 'pick' ? '' : 'disabled', badge = '';
    if (mode === 'pick') { if (removed.includes(l)) { cls += ' gone'; dis = 'disabled'; } if (ui.answer === l) cls += ' sel'; if (gm) badge = `<span class="cnt">${gm[l]}×</span>`; }
    if (mode === 'locked') { if (sub && sub.answer === l) cls += ' sel'; if (removed.includes(l)) cls += ' gone'; }
    if (mode === 'reveal') {
      if (l === S.reveal.correct_answer) cls += ' right';
      else if (mine && mine.answer === l) cls += ' wrong';
      badge = `<span class="cnt">${S.reveal.distribution[l]}×</span>`;
      const v = (voters[l] || []).map(pl).filter(Boolean);
      if (v.length) { cls += ' has-v'; badge += `<span class="voters">${v.slice(0, 8).map(p => av(p.avatar)).join('')}</span>`; }
    }
    return `<button class="${cls}" style="--i:${i}" data-l="${l}" ${dis} onclick="pick('${l}')"><b>${l}.</b><span>${esc(S.question.answers[l])}</span>${badge}${CHECK}</button>`;
  }).join('')}</div>`;
}

const JK = { fifty_fifty: ['½', '50:50'], group_opinion: ['👥', 'Gruppe'], han_solo: ['⭐', 'Han Solo'], safety_net: ['🛟', 'Netz'] };
/* Ist ein Joker gerade sinnvoll nutzbar? Unbrauchbare werden ausgeblendet statt ausgegraut. */
function jokerUsable(key) {
  if (!M || !S || !S.question) return false;
  const left = M.jokers_left || {}, used = M.jokers_this_question || {};
  if (used[key] || ui.joker === key) return true;                          // eingesetzt/gewählt: sichtbar lassen
  const usedCount = Object.keys(used).length + (ui.joker ? 1 : 0);
  if ((left[key] || 0) < 1 || usedCount >= S.settings.max_jokers_per_question) return false;
  if (key === 'group_opinion') return S.players.some(p => p.answered && p.id !== ID.playerId);   // erst wenn jemand abgegeben hat
  if (key === 'han_solo') return (S.question.active_count || 0) >= S.settings.han_solo_min_players;
  if (key === 'safety_net') return ui.stake > 0;
  return true;
}
function jokerBox() {
  const left = M.jokers_left || {}, used = M.jokers_this_question || {};
  const tile = key => { const [icon, label] = JK[key], inst = key === 'fifty_fifty' || key === 'group_opinion';
    const on = inst ? !!used[key] : ui.joker === key;
    return `<button class="jk ${on ? 'on' : ''}" data-jkey="${key}" ${!jokerUsable(key) ? 'hidden' : ''} ${inst && used[key] ? 'disabled' : ''}
      onclick="${inst ? `askJoker('${key}')` : `setJoker('${key}')`}"><span class="n">${left[key] || 0}</span><i>${icon}</i>${inst && used[key] ? 'benutzt' : label}</button>`; };
  const gm = used.group_opinion, ff = used.fifty_fifty;
  return `<div class="box" id="jkBox"><h3>Joker <span style="text-transform:none;letter-spacing:0">· max. ${S.settings.max_jokers_per_question} pro Frage</span></h3>
    <div class="jokers">${Object.keys(JK).map(tile).join('')}</div>
    ${ff ? `<p class="hint" style="margin:10px 0 0">½ 50:50: ${ff.removed.join(' und ')} sind raus.</p>` : ''}
    ${gm ? `<p class="hint" style="margin:10px 0 0">👥 Gruppe (bisher ${gm.total} ${gm.total === 1 ? 'Antwort' : 'Antworten'}): A ${gm.A} · B ${gm.B} · C ${gm.C} · D ${gm.D}</p>` : ''}
    <p class="hint" style="margin:10px 0 0" id="jkHint"></p></div>`;
}
/* Sichtbarkeit live nachziehen (z. B. Gruppe erscheint, sobald jemand abgegeben hat; Netz nur mit Einsatz) */
function syncJokers() {
  const box = $('#jkBox'); if (!box) return;
  let any = false;
  box.querySelectorAll('[data-jkey]').forEach(b => { const ok = jokerUsable(b.dataset.jkey); if (b.hidden === ok) b.hidden = !ok; any = any || ok; });
  box.hidden = !any;
  const h = $('#jkHint'), parts = [];
  if (jokerUsable('han_solo')) parts.push(`⭐ Han Solo: +${S.settings.han_solo_bonus}, wenn nur du richtig liegst`);
  if (jokerUsable('safety_net')) parts.push('🛟 Netz: bei falscher Antwort nur halber Verlust');
  if (h) h.textContent = parts.join(' · ');
  if (h) h.hidden = !parts.length;
}
function askJoker(key) { ui.ask = { type: 'joker', key }; render(true); }
function useJoker(key) {
  ui.ask = null;
  act(() => rpc('quiz_use_joker', { p_player_token: ID.playerToken, p_joker: key }), () => {
    setTimeout(() => {   // Wirkung zeigen: zu den Antworten scrollen
      const a = $('.answers'); if (a) a.scrollIntoView({ behavior: calm() ? 'auto' : 'smooth', block: 'center' });
      setTimeout(() => burstFrom($('.answers')), 350);
      const u = M && M.jokers_this_question;
      if (key === 'fifty_fifty' && u && u.fifty_fifty) toast(`50:50 – ${u.fifty_fifty.removed.join(' und ')} sind raus.`);
      if (key === 'group_opinion') toast('Die Zahlen an den Antworten zeigen, was die anderen gewählt haben.');
    }, 80);
  });
}

function stakeBox() {
  const pts = M.points, max = maxStake(), capped = max < pts;
  if (pts === 0) return `<div class="note">Du hast 0 Punkte – du spielst ohne Einsatz weiter mit. Antworten kannst du trotzdem.</div>`;
  const chips = [0, Math.round(max / 2), max].filter((v, i, a) => a.indexOf(v) === i);
  return `<div class="box"><h3>Dein Einsatz</h3>
    <div class="stake"><button class="round" onclick="setStake(ui.stake-1)" aria-label="weniger">−</button>
      <div style="text-align:center"><div class="num" id="stakeVal" aria-live="polite">${ui.stake}</div><div class="of">${capped ? `höchstens ${max} · du hast ${pts}` : `von ${pts} Punkten`}</div></div>
      <button class="round" onclick="setStake(ui.stake+1)" aria-label="mehr">+</button></div>
    ${chipStacksHtml(ui.stake)}
    <input id="stakeRange" type="range" min="0" max="${max}" step="1" value="${ui.stake}" oninput="setStake(this.value)">
    <div class="chips">${chips.map(v => `<button class="chip ${ui.stake === v ? 'on' : ''}" data-chip="${v}" onclick="setStake(${v})">${v === 0 ? 'Kein Einsatz' : v === max ? (capped ? `Maximum (${max})` : 'All-in') : 'Hälfte'}</button>`).join('')}</div></div>`;
}
function answeredStrip() {
  const req = S.players.filter(p => p.required), sz = isTV() ? 72 : 44;
  return `<div class="strip">${req.map(p => `<span class="who ${p.answered ? '' : 'wait'}" data-pa="${p.id}">${av(p.avatar, sz, p.answered ? '<span class="ok">✓</span>' : '')}<small>${esc(p.nickname)}</small></span>`).join('')}</div>`;
}
const waitingFor = () => { const w = S.players.filter(p => p.required && !p.answered); return !w.length ? 'Alle haben geantwortet – gleich kommt die Auflösung.' : w.length <= 3 ? `Noch offen: ${w.map(p => esc(p.nickname)).join(', ')}` : `Noch ${w.length} Spieler am Überlegen …`; };
const answeredCount = () => { const req = S.players.filter(p => p.required); return `${req.filter(p => p.answered).length} / ${req.length}`; };

function questionView() {
  const q = S.question, tv = isTV(), m = me();
  const mine = m && !tv ? `<span class="mine">${chipIco()}${m.points} · Platz ${m.rank}</span>` : `<span>Frage ${S.progress.current} von ${S.progress.total}</span>`;
  const hero = `<div class="hero">${topbar(esc(q.category || '') + (tv ? '' : ` · Frage ${S.progress.current}/${S.progress.total}`))}
    <div class="meta">${mine}<span class="timer" id="timer"><span id="tt">${mmss(secsLeft(S.deadline))}</span> ⏳</span></div>
    <div class="tbar"><i id="tbar" style="transform:scaleX(${barScale()})"></i></div>
    <h1 class="q">${esc(q.text)}</h1></div>`;
  const waitBox = `<div><h3 class="f" style="text-align:center">Geantwortet · <span id="answered">${answeredCount()}</span></h3>${answeredStrip()}<div class="waitmsg" id="waitmsg">${waitingFor()}</div></div>`;
  if (tv) return `<div class="screen">${hero}<div class="sheet">${answerList('locked')}<div class="grow"></div>${waitBox}
    ${progressBar()}<div class="actions" style="min-height:10px"></div></div>${menuView()}</div>`;
  const sub = M.submission;
  if (sub) return `<div class="screen">${hero}<div class="sheet">${answerList('locked')}
    <div class="status ok"><span class="ic">🔒</span><div><b>Antwort ${sub.answer} ist abgegeben</b>Einsatz ${sub.stake} ${sub.stake === 1 ? 'Punkt' : 'Punkte'}${sub.joker ? ` · ${sub.joker === 'han_solo' ? '⭐ Han Solo' : '🛟 Sicherheitsnetz'}` : ''} – jetzt heißt es warten.</div></div>
    ${waitBox}${progressBar()}<div class="grow"></div></div>${menuView()}</div>`;
  return `<div class="screen">${hero}<div class="sheet">${answerList('pick')}<div class="hint" style="text-align:center;margin:-6px 0 -4px">Schon geantwortet: <b id="answered">${answeredCount()}</b></div>${jokerBox()}${stakeBox()}${progressBar()}<div class="grow"></div>
    <div class="actions"><button class="btn ${ui.answer ? '' : 'wait'}" id="submitBtn" onclick="A.submit()">${submitTxt()}</button></div></div>${menuView()}${askView()}</div>`;
}

/* Vorheriger Stand aus der Auflösung zurückrechnen (Punkte − Änderung) → Platzwechsel ohne gespeicherten Verlauf */
function prevRanks() {
  const ch = Object.fromEntries(S.reveal.results.map(r => [r.player_id, r.change || 0]));
  const prev = S.players.map(p => ({ id: p.id, pts: p.points - (ch[p.id] || 0), nm: p.nickname.toLowerCase() }))
    .sort((a, b) => b.pts - a.pts || a.nm.localeCompare(b.nm));
  const out = {}; prev.forEach((p, i) => { out[p.id] = { rank: i && prev[i - 1].pts === p.pts ? out[prev[i - 1].id].rank : i + 1, pts: p.pts, idx: i }; });
  return out;
}
function rankRows() {
  const res = Object.fromEntries(S.reveal.results.map(r => [r.player_id, r])), prev = prevRanks();
  const allTied = new Set(Object.values(prev).map(x => x.pts)).size < 2;   // z. B. nach Frage 1: vorher alle gleich → keine Pfeile
  return `<div class="rows" id="rankRows">${S.players.map(p => {
    const r = res[p.id], pr = prev[p.id], move = pr && !allTied ? pr.rank - p.rank : 0;
    const sub = r ? (r.timed_out ? 'Zeit abgelaufen' : `${r.answer} · Einsatz ${r.stake}${r.joker ? ' · ' + (r.joker === 'han_solo' ? '⭐ Han Solo' : '🛟 Netz') : ''}`) : '';
    return `<div class="row ${ID && p.id === ID.playerId ? 'me' : ''} ${p.required && p.is_ready ? 'isready' : ''}" data-rid="${p.id}" data-prev="${pr ? pr.idx : ''}"><span class="rk">${p.rank}</span>${av(p.avatar)}
      <div class="nm">${esc(p.nickname)}${move > 0 ? `<span class="ch up">▲${move}</span>` : move < 0 ? `<span class="ch down">▼${-move}</span>` : ''}${p.points === 0 ? '<span class="zbadge">0 Punkte</span>' : ''}<span class="rdy" title="hat auf Weiter getippt">✓ weiter</span><small>${esc(sub)}</small></div>
      <div class="pts">${chipIco()}<span class="ticker" data-from="${pr ? pr.pts : p.points}" data-to="${p.points}">${p.points}</span>${r ? `<small class="${r.change > 0 ? 'pos' : r.change < 0 ? 'neg' : 'zero'}">${sgn(r.change)}${r.bonus ? ' ★' : ''}</small>` : ''}</div></div>`;
  }).join('')}</div>`;
}
const revealWaiting = () => { const w = S.players.filter(p => p.required && !p.is_ready); return !w.length ? 'Alle bereit – es geht weiter …' : w.length <= 3 ? `Warten auf ${w.map(p => esc(p.nickname)).join(', ')}` : `Warten auf ${w.length} Spieler`; };
function revealView() {
  const q = S.question, rv = S.reveal, tv = isTV();
  const mine = ownResult(), m = me();
  const hero = `<div class="hero">${topbar('Auflösung · Frage ' + S.progress.done + '/' + S.progress.total)}
    <div class="meta"><span>${tv ? 'Richtig ist ' + rv.correct_answer : ''}</span>${S.ready_deadline ? `<span class="timer" id="timer"><span id="tt">${mmss(secsLeft(S.ready_deadline))}</span></span>` : '<span></span>'}</div>
    <h1 class="q small" ${tv ? '' : 'style="font-size:24px"'}>${esc(q.text)}</h1></div>`;
  let banner = '';
  if (mine && m) {
    const title = mine.timed_out ? 'Zeit abgelaufen' : mine.correct ? (mine.bonus ? 'Han Solo!' : 'Richtig!') : 'Leider falsch';
    const detail = mine.timed_out ? 'Kein Einsatz – du verlierst nichts.' : mine.change === 0 ? (mine.correct ? 'Ohne Einsatz – keine Punkte.' : 'Ohne Einsatz – nichts verloren.') : `${sgn(mine.change)} ${Math.abs(mine.change) === 1 ? 'Punkt' : 'Punkte'}${mine.bonus ? ` (inkl. ${mine.bonus} Bonus)` : ''}${mine.joker === 'safety_net' && !mine.correct ? ' – das Netz hat die Hälfte gerettet' : ''}`;
    banner = `<div class="banner ${mine.change > 0 || (mine.correct && !mine.change) ? 'ok' : mine.change < 0 ? 'bad' : 'zero'}">${av(m.avatar, 56)}
      <div style="flex:1"><div class="t ${mine.change > 0 ? 'pos' : mine.change < 0 ? 'neg' : ''}">${title}</div><div class="hint" style="color:var(--text)">${detail}</div>
      <div class="hint">Jetzt <b class="ticker" data-from="${m.points - (mine.change || 0)}" data-to="${m.points}">${m.points}</b> Punkte · Platz ${m.rank} von ${S.players.length}</div></div></div>`;
  }
  const required = m && m.required;
  const action = tv ? `<div class="hint" style="text-align:center;width:100%;font-size:clamp(16px,1.3vw,26px)" id="waiting">${revealWaiting()}</div>`
    : required ? `<button class="btn ${M.is_ready ? 'ghost' : ''}" onclick="A.ready(${M.is_ready ? 'false' : 'true'})">${M.is_ready ? 'Warte auf die anderen … (zurücknehmen)' : S.progress.done >= S.progress.total ? 'Zum Endergebnis' : 'Weiter zur nächsten Frage'}</button><div class="hint" style="text-align:center" id="waiting">${revealWaiting()}</div>`
    : '<div class="note">Du hast 0 Punkte und musst nicht auf „Weiter“ tippen – schau einfach zu.</div>';
  const expl = rv.explanation ? `<div class="note">💡 ${esc(rv.explanation)}</div>` : '';
  if (tv) return `<div class="screen">${hero}<div class="sheet"><div class="revcols"><div style="display:flex;flex-direction:column;gap:2vh">${answerList('reveal')}${expl}</div>
    <div><h3 class="f" style="margin-top:0">Rangliste</h3>${rankRows()}</div></div><div class="grow"></div><div class="actions">${action}</div></div>${menuView()}</div>`;
  return `<div class="screen">${hero}<div class="sheet">${banner}${answerList('reveal')}${expl}
    <div><h3 class="f">Rangliste</h3>${rankRows()}</div><div class="grow"></div><div class="actions">${action}</div></div>${menuView()}</div>`;
}

function awards(f) {
  const top = (key, dir) => { const v = f.filter(p => p[key] != null && (dir > 0 ? p[key] > 0 : p[key] < 0)); if (!v.length) return null;
    const best = v.reduce((a, b) => (dir > 0 ? b[key] > a[key] : b[key] < a[key]) ? b : a); return best; };
  const out = [], acc = f.filter(p => p.answered).reduce((a, b) => (!a || b.correct > a.correct ? b : a), null);
  const bw = top('best_win', 1), wl = top('worst_loss', -1), jk = top('jokers_used', 1);
  if (acc && acc.correct) out.push(['🎯', 'Treffsicher', `${esc(acc.nickname)} · ${acc.correct} richtig`]);
  if (bw) out.push(['💰', 'Größter Coup', `${esc(bw.nickname)} · +${bw.best_win}`]);
  if (wl) out.push(['🎢', 'Mutigster Absturz', `${esc(wl.nickname)} · ${wl.worst_loss}`]);
  if (jk) out.push(['🃏', 'Joker-Fan', `${esc(jk.nickname)} · ${jk.jokers_used} Joker`]);
  return out;
}
function finishedView() {
  const f = S.final, tv = isTV(), mine = ID && f.find(p => p.player_id === ID.playerId);
  const podium = [f[1], f[0], f[2]].map((p, i) => p ? `<div class="pl p${[2, 1, 3][i]}">${avFull(p.avatar)}<div class="nm">${esc(p.nickname)}</div><div class="pt">${p.points} Punkte</div><div class="blk">${p.rank}</div></div>` : '<div class="pl"></div>').join('');
  const ties = f.filter(p => p.rank === 1);
  const head = ties.length > 1 ? `🏆 Gleichstand: ${ties.map(p => esc(p.nickname)).join(' &amp; ')}` : f[0] ? `🏆 ${esc(f[0].nickname)} gewinnt!` : 'Spiel beendet';
  const hero = `<div class="hero">${topbar('Spiel beendet')}<h1 class="q" style="text-align:center;margin-top:10px;font-size:${tv ? '' : '26px'}">${head}</h1><div class="podium">${podium}</div></div>`;
  const myNote = mine ? `<div class="status ${mine.rank === 1 ? 'ok' : ''}"><span class="ic">${mine.rank === 1 ? '🥇' : mine.rank === 2 ? '🥈' : mine.rank === 3 ? '🥉' : '🎉'}</span><div><b>Du bist auf Platz ${mine.rank} von ${f.length}</b>${mine.points} Punkte · ${mine.correct} von ${mine.answered} richtig</div></div>` : '';
  const aw = awards(f);
  const tl = a => a.map(x => (x > 0 ? '+' : '') + x).join(' ');
  return `<div class="screen">${hero}<div class="sheet">${myNote}
    ${aw.length ? `<div class="awards">${aw.map((x, i) => `<div class="award" style="--i:${i}"><i>${x[0]}</i> ${x[1]}<b>${x[2]}</b></div>`).join('')}</div>` : ''}
    <div class="fin"><h3 class="f">Endstand</h3><div class="rows">${f.map(p => `<div class="row ${ID && p.player_id === ID.playerId ? 'me' : ''}"><span class="rk">${p.rank}</span>${av(p.avatar)}
    <div class="nm">${esc(p.nickname)}<small>${p.correct} von ${p.answered} richtig</small></div><div class="pts">${chipIco()}${p.points}</div></div>`).join('')}</div></div>
    <details class="set"><summary>Verlauf aller Spieler</summary>${f.map(p => `<div style="padding:8px 0;border-top:1px solid var(--line)"><b>${esc(p.nickname)}</b>
      <div class="hint">Bester Gewinn ${p.best_win ?? '–'} · Größter Verlust ${p.worst_loss ?? '–'} · Joker ${p.jokers_used}</div><div class="hint">Verlauf: ${tl(p.timeline)}</div></div>`).join('')}</details>
    <div class="grow"></div><div class="actions"><button class="btn" onclick="leave()">${tv ? 'Neue Runde' : 'Zur Startseite'}</button></div></div></div>`;
}

/* ---------- Effekte (nur beim ersten Anzeigen einer Ansicht) ---------- */
const calm = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(n = 70) {
  if (calm()) return;
  const cols = ['#e07a67', '#f2c76a', '#2b7a5b', '#7fc4c4', '#17484d', '#f4a7b9'];
  const box = document.createElement('div'); box.className = 'confetti';
  box.innerHTML = Array.from({ length: n }, (_, k) => `<i class="${k % 3 === 0 ? 'cc' : ''}" style="left:${Math.random() * 100}%;background:${cols[Math.random() * cols.length | 0]};--x:${(Math.random() - .5) * 220}px;--r:${(Math.random() - .5) * 1440}deg;--d:${1.8 + Math.random() * 1.6}s;--w:${Math.random() * .5}s"></i>`).join('');
  document.body.appendChild(box); setTimeout(() => box.remove(), 4200);
}
function countUp(el, delay = 0, dur = 900) {
  const from = Number(el.dataset.from), to = Number(el.dataset.to);
  if (from === to || calm()) return;
  el.textContent = from;
  setTimeout(() => { const t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step); }, delay);
}
/* Rangliste: Zeilen starten auf dem alten Platz und gleiten auf den neuen (FLIP) */
function flipRows() {
  const box = $('#rankRows'); if (!box || calm()) return;
  const rows = [...box.children]; if (rows.length < 2) return;
  const h = rows[1].offsetTop - rows[0].offsetTop;
  let moved = false;
  rows.forEach((r, i) => { const pi = r.dataset.prev === '' ? i : Number(r.dataset.prev); if (pi !== i) moved = true; r.style.transform = `translateY(${(pi - i) * h}px)`; });
  if (!moved) return;
  setTimeout(() => { box.classList.add('flip'); rows.forEach(r => (r.style.transform = '')); }, 1100);
}
const buzz = p => { try { if (!isTV() && navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(p); } catch {} };
function effects() {
  if (!S || !ID) return;
  if (S.status === 'reveal') {
    const mine = ownResult();
    if (mine && mine.correct) { confetti(mine.bonus ? 120 : 60); buzz(40); }
    else if (mine && mine.change < 0) buzz([70, 50, 70]);
    flipRows();
    document.querySelectorAll('.ticker[data-from]').forEach(e => countUp(e, 1100));
  }
  if (S.status === 'finished') { setTimeout(() => confetti(140), 1300); buzz([40, 60, 40, 60, 120]); }
}

/* ---------- Rendering ---------- */
function viewKey() {
  if (!ID || !S) return 'home' + ui.step + ui.mode + ui.avatar + ui.taken.join() + (pool ? pool.active : '') + ui.solo;
  if (tutActive()) return 'tut' + ui.tutStep;
  const st = S.status, ex = '|' + ui.menu + ui.confirm + (ui.ask ? ui.ask.type : '');
  if (st === 'lobby') return 'lobby' + isAdmin() + (M ? M.is_ready : '') + S.settings.min_players + ex;   // Spielerliste wird per patchLobby() gepflegt
  if (st === 'question_active') return 'q' + S.question.sq_id + (M ? (M.submission ? 's' : 'o') + M.points + JSON.stringify(M.jokers_this_question) + JSON.stringify(M.jokers_left) : 'tv') + ex;
  if (st === 'reveal') return 'r' + S.question.sq_id + (M ? M.is_ready : '') + S.players.length + ex;
  return 'f' + st;
}
let lastViewId = '';
const viewId = () => (!ID || !S) ? 'home' + ui.step : tutActive() ? 'tut' : S.status + '|' + (S.question ? S.question.sq_id : '');
function render(force) {
  const key = viewKey();
  if (key === lastKey && !force) return live();
  const vid = viewId(), sameView = vid === lastViewId, sy = window.scrollY; lastViewId = vid;
  const a = document.activeElement, keep = a && a.id && a.tagName === 'INPUT' ? { id: a.id, pos: a.selectionStart } : null;
  lastKey = key;
  document.body.classList.toggle('tv', !!isTV());
  document.body.classList.toggle('start', !ID || !S);
  document.title = S && ID && S.status !== 'finished' ? `${APP_NAME} ${S.code}` : APP_NAME;
  const app = $('#app');
  if (!ID || !S) { app.innerHTML = homeView(); if (!pool) loadPool(); }
  else app.innerHTML = tutActive() ? tutorialView() : { lobby: lobbyView, question_active: questionView, reveal: revealView, finished: finishedView }[S.status]();
  if (sameView) { document.querySelectorAll('.screen').forEach(e => e.classList.add('noanim')); window.scrollTo(0, sy); }   // gleiche Ansicht: nicht neu einblenden
  if (keep) { const e = document.getElementById(keep.id); if (e) { e.focus(); try { e.setSelectionRange(keep.pos, keep.pos); } catch {} } }
  if (!sameView) effects();
  live();
}
function live() {   // kleine Änderungen ohne komplettes Neuzeichnen (Eingaben bleiben erhalten)
  if (!S) return;
  const a = $('#answered'); if (a && S.status === 'question_active') a.textContent = answeredCount();
  document.querySelectorAll('[data-pa]').forEach(e => { const p = pl(e.dataset.pa); if (p && p.answered && !e.querySelector('.ok')) { e.querySelector('.av').insertAdjacentHTML('beforeend', '<span class="ok">✓</span>'); e.classList.remove('wait'); } });
  syncJokers();
  const wm = $('#waitmsg'); if (wm && S.status === 'question_active') { const t = waitingFor(); if (wm.innerHTML !== t) wm.innerHTML = t; }
  const w = $('#waiting'); if (w) { const t = revealWaiting(); if (w.innerHTML !== t) w.innerHTML = t; }
  document.querySelectorAll('.row[data-rid]').forEach(e => { const p = pl(e.dataset.rid); e.classList.toggle('isready', !!(p && p.required && p.is_ready)); });
  if (S.status === 'lobby' && !tutActive()) patchLobby();
}
async function loadPool() { try { pool = await rpc('quiz_pool_info'); if (!ID) { lastKey = ''; render(); } } catch {} }

/* ---------- Start ---------- */
(function init() {
  if (!CFG.url || CFG.url.includes('DEIN-PROJEKT')) {
    $('#app').innerHTML = '<div class="screen"><div class="hero"><h1 class="q">Nicht konfiguriert</h1></div><div class="sheet"><p>Bitte in <code>config.js</code> die Supabase-URL und den anon-Key eintragen (siehe SETUP.md).</p></div></div>';
    return;
  }
  ID = loadId();
  if (ID) { if (ID.role === 'tv') document.body.classList.add('tv'); startSync(); }
  render(true);
  // Per QR-Code/Link gekommen: Code-Schritt überspringen, direkt zu Name + Avatar
  const urlCode = new URLSearchParams(location.search).get('code');
  if (!ID && urlCode) joinNext(urlCode);
})();
</script>
</body>
</html>
