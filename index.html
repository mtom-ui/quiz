<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="0.1.1">
<title>Quiz</title>
<style>
  /* Iteration 1: bewusst schlicht – nur Funktion, kein Design. */
  :root { color-scheme: light dark; --line: #8886; --accent: #2a6df4; --ok: #1a8f3c; --bad: #d03030; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; }
  #app { max-width: 560px; margin: 0 auto; padding: 12px 14px 90px; }
  body.tv #app { max-width: 1200px; font-size: 22px; }
  h1, h2, h3 { margin: .6em 0 .3em; }
  button { font: inherit; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: #8881; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { color: var(--bad); border-color: var(--bad); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input, select { font: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; width: 100%; }
  input[type=range] { padding: 0; }
  label { display: block; margin: 8px 0 2px; font-size: .9em; opacity: .8; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row > * { flex: 1; }
  .row > .fit { flex: 0 0 auto; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  .muted { opacity: .65; font-size: .9em; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); padding: 6px 0; }
  #timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.3em; }
  #timer.low { color: var(--bad); }
  .qtext { font-size: 1.25em; font-weight: 600; margin: 12px 0; }
  body.tv .qtext { font-size: 2em; }
  .answers { display: grid; gap: 8px; }
  body.tv .answers { grid-template-columns: 1fr 1fr; }
  .ans { text-align: left; display: flex; gap: 10px; }
  .ans b { min-width: 1.4em; }
  .ans.sel { outline: 3px solid var(--accent); }
  .ans.gone { opacity: .25; text-decoration: line-through; }
  .ans.right { background: #1a8f3c33; border-color: var(--ok); }
  .ans.wrong { background: #d0303022; border-color: var(--bad); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); font-size: .95em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pos { color: var(--ok); } .neg { color: var(--bad); }
  .me { font-weight: 700; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); font-size: .8em; }
  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 16px; border-radius: 10px; max-width: 90vw; z-index: 9; display: none; }
  #toast.err { background: var(--bad); }
  .qr { background: #fff; padding: 8px; display: inline-block; border-radius: 8px; }
  .qr svg { width: 220px; height: 220px; display: block; }
  body.tv .qr svg { width: 320px; height: 320px; }
  .code { font-size: 2.2em; font-weight: 800; letter-spacing: .15em; }
  .tvgrid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
  @media (max-width: 800px) { .tvgrid { grid-template-columns: 1fr; } }
  .admin { border-style: dashed; }
  details > summary { cursor: pointer; padding: 4px 0; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="config.js"></script>
<script src="lib/qrcode.js"></script>
<script>
'use strict';
/* ====================================================================
   Quiz – Frontend (Iteration 1: Funktion vor Design)
   Der Browser hält KEINE Spiellogik. Er zeigt den öffentlichen Zustand
   (quiz_state) und die private Sicht des Spielers (quiz_my_state) an und
   sendet Aktionen als RPC. Alles Verbindliche prüft der Server.
   ==================================================================== */
const CFG = window.QUIZ_CONFIG || {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const ERR = {
  session_not_found: 'Diese Spielrunde gibt es nicht.', session_finished: 'Diese Runde ist bereits beendet.',
  session_full: 'Die Runde ist voll.', nickname_taken: 'Dieser Name ist schon vergeben.',
  invalid_nickname: 'Bitte einen Namen mit 1–20 Zeichen eingeben.', not_enough_players: 'Es fehlen noch Spieler.',
  no_questions: 'Es sind keine aktiven Fragen in der Datenbank. seed.sql ausgeführt?',
  wrong_phase: 'Das geht gerade nicht (andere Phase).', too_late: 'Zu spät – die Zeit ist abgelaufen.',
  already_submitted: 'Du hast schon geantwortet.', invalid_stake: 'Ungültiger Einsatz.',
  invalid_answer: 'Bitte eine Antwort wählen.', question_changed: 'Die Frage hat gewechselt.',
  answer_removed: 'Diese Antwort wurde per 50:50 entfernt.', joker_not_available: 'Dieser Joker ist aufgebraucht.',
  joker_already_used: 'Joker schon in dieser Frage benutzt.', joker_limit_question: 'Pro Frage sind nicht mehr Joker erlaubt.',
  safety_net_needs_stake: 'Das Sicherheitsnetz braucht einen Einsatz über 0.', not_admin: 'Nur der Admin darf das.',
  skip_only_before_reveal: 'Überspringen geht nur vor der Auflösung.', question_not_in_session: 'Diese Frage gehört nicht zur Runde.',
  cannot_kick_admin: 'Der Admin kann nicht entfernt werden.', player_not_found: 'Dich gibt es in dieser Runde nicht mehr.',
};
const errText = e => ERR[e.message] || e.message || 'Unbekannter Fehler';

/* ---------- API ---------- */
async function rpc(fn, args) {
  const r = await fetch(`${CFG.url}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    // Neue Publishable-Keys (sb_publishable_…) sind keine JWTs und gehören nur in den apikey-Header.
    headers: { apikey: CFG.key, ...(String(CFG.key).startsWith('eyJ') ? { Authorization: `Bearer ${CFG.key}` } : {}), 'Content-Type': 'application/json' },
    body: JSON.stringify(args || {}),
  });
  const j = await r.json().catch(() => null);
  if (!r.ok) throw new Error((j && j.message) || `HTTP ${r.status}`);
  return j;
}

/* ---------- Zustand ---------- */
let ID = null;          // Identität dieses Geräts: {sid, code, role, playerToken, playerId, adminToken}
let S = null;           // öffentlicher Zustand
let M = null;           // private Sicht (nur Spieler)
let offset = 0;         // Serverzeit - Gerätezeit (ms)
let ui = { stake: 1, answer: null, joker: '', confirm: null, reason: '', nick: '', code: '', settingsOpen: false };
let pool = null;
let lastKey = '', lastQ = null, seenEvent = null, busy = false, lastPoke = 0, rt = null;

const save = () => {
  try { sessionStorage.setItem('quiz.id', JSON.stringify(ID)); localStorage.setItem('quiz.last', JSON.stringify(ID)); } catch {}
};
const loadId = () => { try { return JSON.parse(sessionStorage.getItem('quiz.id')); } catch { return null; } };
const loadLast = () => { try { return JSON.parse(localStorage.getItem('quiz.last')); } catch { return null; } };
function leave() {
  ID = S = M = null; lastKey = '';
  try { sessionStorage.removeItem('quiz.id'); localStorage.removeItem('quiz.last'); } catch {}
  if (rt) { rt.close(); rt = null; }
  history.replaceState(null, '', location.pathname);
  render(true);
}

const isTV = () => ID && ID.role === 'tv';
const isAdmin = () => ID && !!ID.adminToken;
const me = () => S && ID && S.players.find(p => p.id === ID.playerId);
const joinUrl = () => `${location.origin}${location.pathname}?code=${S ? S.code : ID.code}`;

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), err ? 4500 : 3000);
}
async function act(fn, args, after) {
  try {
    const r = await fn(args);
    if (after) after(r);
    await refresh(true);
    return r;
  } catch (e) { toast(errText(e), true); await refresh(true).catch(() => {}); }
}

/* ---------- Laden / Synchronisieren ---------- */
async function refresh(force) {
  if (!ID || busy && !force) return;
  busy = true;
  try {
    const [s, m] = await Promise.all([
      rpc('quiz_state', { p_session_id: ID.sid }),
      ID.playerToken ? rpc('quiz_my_state', { p_player_token: ID.playerToken }) : null,
    ]);
    offset = Date.parse(s.server_now) - Date.now();
    S = s; M = m;
    if (S.status === 'question_active' && S.question && lastQ !== S.question.sq_id) {
      lastQ = S.question.sq_id; ui.answer = null; ui.joker = ''; ui.confirm = null; ui.reason = '';
      ui.stake = Math.min(1, M ? M.points : 0);
    }
    handleEvent();
    render();
  } catch (e) {
    if (e.message === 'session_not_found' || e.message === 'player_not_found') { toast(errText(e), true); leave(); }
  } finally { busy = false; }
}
function handleEvent() {
  const ev = S.last_event;
  if (!ev) return;
  if (seenEvent === null) { seenEvent = ev.at; return; }
  if (ev.at === seenEvent) return;
  seenEvent = ev.at;
  const txt = { skipped: 'Der Admin hat die Frage übersprungen – keine Punkte, keine Joker verbraucht.',
    blocked: 'Der Admin hat die Frage dauerhaft gesperrt und übersprungen.',
    blocked_after_reveal: 'Der Admin hat die vorige Frage dauerhaft gesperrt.',
    ended: 'Der Admin hat das Spiel beendet.' }[ev.type];
  if (txt) toast(txt);
}

/* Minimaler Supabase-Realtime-Client (Phoenix-Protokoll). Löst nur ein Neuladen aus;
   ohne Realtime sorgt das Polling weiterhin für Synchronisierung. */
function connectRealtime() {
  if (CFG.dev || !ID || rt) return;
  let ws, ref = 0, hb;
  try {
    ws = new WebSocket(`${CFG.url.replace(/^http/, 'ws')}/realtime/v1/websocket?apikey=${encodeURIComponent(CFG.key)}&vsn=1.0.0`);
  } catch { return; }
  rt = { ws, ok: false, close() { clearInterval(hb); try { ws.close(); } catch {} } };
  const send = (topic, event, payload) => ws.send(JSON.stringify({ topic, event, payload, ref: String(++ref) }));
  ws.onopen = () => {
    send(`realtime:quiz-${ID.sid}`, 'phx_join', { config: {
      broadcast: { ack: false, self: false }, presence: { key: '' }, private: false,
      postgres_changes: [{ event: '*', schema: 'public', table: 'quiz_sessions', filter: `id=eq.${ID.sid}` }] },
      access_token: CFG.key });
    hb = setInterval(() => send('phoenix', 'heartbeat', {}), 25000);
  };
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.event === 'phx_reply' && m.payload && m.payload.status === 'ok' && m.topic.startsWith('realtime:')) rt.ok = true;
    if (m.event === 'postgres_changes') refresh(true);
  };
  ws.onclose = () => { clearInterval(hb); rt = null; setTimeout(connectRealtime, 3000); };
  ws.onerror = () => {};
}

/* Takt: Countdown anzeigen, abgelaufene Fristen beim Server anstoßen, Polling */
setInterval(() => {
  const t = $('#timer');
  if (!S) return;
  const now = Date.now() + offset;
  if (S.status === 'question_active' && S.deadline) {
    const left = (Date.parse(S.deadline) - now) / 1000;
    if (t) { t.textContent = Math.max(0, Math.ceil(left)) + ' s'; t.classList.toggle('low', left <= 10); }
    if (left < -(S.settings.grace_ms / 1000) - 0.3 && Date.now() - lastPoke > 1000) { lastPoke = Date.now(); refresh(true); }
  } else if (S.status === 'reveal' && S.ready_deadline) {
    const left = (Date.parse(S.ready_deadline) - now) / 1000;
    if (t) t.textContent = Math.max(0, Math.ceil(left)) + ' s';
    if (left < -0.3 && Date.now() - lastPoke > 1000) { lastPoke = Date.now(); refresh(true); }
  }
}, 250);
setInterval(() => { if (ID) refresh(); }, 1500);

/* ---------- Aktionen ---------- */
const settingsFromForm = () => {
  const v = id => { const e = $('#' + id); return e && e.value !== '' ? Number(e.value) : undefined; };
  const s = { question_count: v('s_count'), answer_seconds: v('s_secs'), start_points: v('s_pts'),
    max_jokers_per_question: v('s_jpq'), han_solo_min_players: v('s_hsmin'), ready_timeout_seconds: v('s_rt'),
    difficulty_order: $('#s_order') ? $('#s_order').value : undefined };
  Object.keys(s).forEach(k => s[k] === undefined && delete s[k]);
  return s;
};
async function createGame(mode) {
  const nick = ($('#nick') || {}).value || '';
  const plays = mode === 'phone' ? true : false;
  if (plays && !nick.trim()) return toast('Bitte einen Namen eingeben.', true);
  try {
    const r = await rpc('quiz_create_session', { p_mode: mode, p_nickname: plays ? nick : null,
      p_admin_plays: plays, p_settings: settingsFromForm() });
    ID = { sid: r.session_id, code: r.code, role: mode === 'tv' ? 'tv' : 'player',
      playerToken: r.player_token, playerId: r.player_id, adminToken: r.admin_token };
    save(); startSync();
    if (mode === 'tv') document.body.classList.add('tv');
    history.replaceState(null, '', location.pathname);
  } catch (e) { toast(errText(e), true); }
}
async function joinGame() {
  const code = ($('#code').value || '').trim().toUpperCase(), nick = ($('#jnick').value || '').trim();
  if (!code) return toast('Bitte den Code eingeben.', true);
  try {
    const r = await rpc('quiz_join', { p_code: code, p_nickname: nick });
    ID = { sid: r.session_id, code: r.code, role: 'player', playerToken: r.player_token, playerId: r.player_id };
    save(); startSync(); history.replaceState(null, '', location.pathname);
  } catch (e) { toast(errText(e), true); }
}
async function watchTV() {   // nur zuschauen (ohne Spielerrolle), z. B. zweiter Bildschirm
  const code = ($('#code').value || '').trim().toUpperCase();
  if (!code) return toast('Bitte den Code eingeben.', true);
  try {
    const s = await rpc('quiz_state_by_code', { p_code: code });
    ID = { sid: s.id, code: s.code, role: 'tv' }; save(); startSync(); document.body.classList.add('tv');
  } catch (e) { toast(errText(e), true); }
}
function startSync() { lastKey = ''; seenEvent = null; lastQ = null; connectRealtime(); refresh(true); }

const A = {
  ready: on => act(() => rpc('quiz_set_ready', { p_player_token: ID.playerToken, p_ready: on })),
  start: () => act(() => rpc('quiz_start', { p_admin_token: ID.adminToken })),
  joker: j => act(() => rpc('quiz_use_joker', { p_player_token: ID.playerToken, p_joker: j })),
  submit: () => {
    if (!ui.answer) return toast('Bitte erst eine Antwort wählen.', true);
    act(() => rpc('quiz_submit', { p_player_token: ID.playerToken, p_sq_id: S.question.sq_id,
      p_answer: ui.answer, p_stake: ui.stake, p_joker: ui.joker || null }));
  },
  skip: () => act(() => rpc('quiz_admin_skip', { p_admin_token: ID.adminToken })),
  next: () => act(() => rpc('quiz_admin_next', { p_admin_token: ID.adminToken })),
  end: () => { ui.confirm = null; act(() => rpc('quiz_admin_end', { p_admin_token: ID.adminToken })); },
  kick: id => act(() => rpc('quiz_admin_kick', { p_admin_token: ID.adminToken, p_player_id: id })),
  block: () => {
    const reason = ($('#reason') || {}).value || '';
    ui.confirm = null;
    act(() => rpc('quiz_admin_block', { p_admin_token: ID.adminToken, p_question_id: S.question.question_id, p_reason: reason }));
  },
};
const setConfirm = c => { ui.confirm = c; render(true); };
const pick = l => { ui.answer = l; document.querySelectorAll('.ans').forEach(b => b.classList.toggle('sel', b.dataset.l === l)); };
const setStake = v => {
  const max = M ? M.points : 0;
  ui.stake = Math.max(0, Math.min(max, Math.round(Number(v) || 0)));
  if (ui.stake === 0 && ui.joker === 'safety_net') ui.joker = '';
  $('#stakeVal').textContent = ui.stake; $('#stakeRange').value = ui.stake;
  document.querySelectorAll('[data-jk=safety_net]').forEach(e => (e.disabled = ui.stake === 0));
};
const setJoker = j => { ui.joker = ui.joker === j ? '' : j; document.querySelectorAll('[data-jk]').forEach(b => b.classList.toggle('primary', b.dataset.jk === ui.joker)); };

/* ---------- Ansichten ---------- */
function qrSvg(text) {
  try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ scalable: true, margin: 1 }); }
  catch { return '<p class="muted">QR-Code nicht verfügbar – bitte Link oder Code verwenden.</p>'; }
}
const playersTable = (withReady) => `<table><tbody>${S.players.map(p => `
  <tr class="${ID && p.id === ID.playerId ? 'me' : ''}"><td>${esc(p.nickname)}${p.is_admin ? ' <span class="pill">Admin</span>' : ''}${ID && p.id === ID.playerId ? ' (du)' : ''}</td>
  <td>${withReady ? (p.is_ready ? '✅ bereit' : '⏳ wartet') : ''}</td>
  <td class="num">${isAdmin() && !p.is_admin && S.status === 'lobby' ? `<button onclick="A.kick('${p.id}')">entfernen</button>` : ''}</td></tr>`).join('')}</tbody></table>`;

function rankingTable() {
  return `<table><thead><tr><th class="num">#</th><th>Spieler</th><th class="num">Punkte</th></tr></thead><tbody>${S.players.map(p => `
    <tr class="${ID && p.id === ID.playerId ? 'me' : ''}"><td class="num">${p.rank}</td><td>${esc(p.nickname)}${ID && p.id === ID.playerId ? ' (du)' : ''}${p.points === 0 ? ' <span class="pill">0 Punkte</span>' : ''}</td><td class="num">${p.points}</td></tr>`).join('')}</tbody></table>`;
}

function homeView() {
  const last = loadLast();
  const urlCode = new URLSearchParams(location.search).get('code') || '';
  const poolTxt = pool ? `${pool.active} aktive Fragen (leicht ${pool.by_difficulty['1']} · mittel ${pool.by_difficulty['2']} · schwer ${pool.by_difficulty['3']}), ${pool.blocked} gesperrt` : '…';
  const st = (id, label, val, extra = '') => `<label>${label}</label><input id="${id}" type="number" ${extra} placeholder="${val}">`;
  return `<h1>Quiz</h1><p class="muted">Fragenpool: ${poolTxt}</p>
  ${last && last.sid ? `<div class="card"><b>Laufende Runde ${esc(last.code)}</b><div class="row" style="margin-top:6px">
     <button class="primary" onclick="resume()">Fortsetzen</button><button class="fit" onclick="leave()">Vergessen</button></div></div>` : ''}
  <div class="card"><h2>Beitreten</h2>
    <label>Code</label><input id="code" value="${esc(urlCode)}" maxlength="5" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase">
    <label>Dein Name</label><input id="jnick" maxlength="20" autocomplete="off">
    <div class="row" style="margin-top:10px"><button class="primary" onclick="joinGame()">Beitreten</button>
    <button onclick="watchTV()" title="Nur zuschauen, ohne mitzuspielen">Nur zuschauen (TV)</button></div></div>
  <div class="card"><h2>Neue Runde</h2>
    <details ${ui.settingsOpen ? 'open' : ''} ontoggle="ui.settingsOpen=this.open"><summary>Einstellungen (optional)</summary>
      ${st('s_count', 'Fragen pro Runde', 10, 'min=1 max=50')}${st('s_secs', 'Sekunden pro Frage', 45, 'min=10 max=120')}
      ${st('s_pts', 'Startpunkte', 10, 'min=1 max=1000')}${st('s_jpq', 'Max. Joker pro Frage', 1, 'min=1 max=4')}
      ${st('s_hsmin', 'Han Solo ab Spielerzahl', 3, 'min=2')}${st('s_rt', 'Weiter-Timeout in Sekunden (leer = aus)', '', 'min=5')}
      <label>Reihenfolge</label><select id="s_order"><option value="ascending">Schwierigkeit steigt</option><option value="random">zufällig</option></select>
    </details>
    <label>Dein Name (für „Handy“)</label><input id="nick" maxlength="20" autocomplete="off" placeholder="Name als Admin &amp; Spieler">
    <div class="row" style="margin-top:10px">
      <button class="primary" onclick="createGame('phone')">Handy-Modus</button>
      <button onclick="createGame('tv')">TV-Modus</button></div>
    <p class="muted">Handy: Du bist Admin und spielst mit. TV: Dieses Gerät zeigt das Spiel; mitspielen kannst du zusätzlich mit dem Handy.</p>
  </div>`;
}
function adminBox() {
  if (!isAdmin()) return '';
  const st = S.status;
  let btns = '', panels = '';
  if (st === 'lobby') {
    const need = S.settings.min_players;
    btns += `<button class="primary" onclick="A.start()" ${S.players.length < need ? 'disabled' : ''}>Spiel starten</button>`;
    if (S.players.length < need) panels += `<p class="muted">Mindestens ${need} Spieler nötig.</p>`;
  }
  if (st === 'question_active') btns += `<button onclick="A.skip()">Frage überspringen</button>`;
  if (st === 'reveal') btns += `<button onclick="A.next()">Weiter erzwingen</button>`;
  if (S.question && (st === 'question_active' || st === 'reveal')) {
    if (ui.confirm === 'block') panels += `<div class="card"><b>Diese Frage dauerhaft sperren?</b>
      <p class="muted">Sie erscheint nie wieder in einer Runde. Läuft sie gerade, wird sie ohne Wertung übersprungen.</p>
      <input id="reason" placeholder="Grund (optional)" value="${esc(ui.reason)}" oninput="ui.reason=this.value">
      <div class="row" style="margin-top:8px"><button class="danger" onclick="A.block()">Ja, dauerhaft sperren</button><button onclick="setConfirm(null)">Abbrechen</button></div></div>`;
    else btns += `<button class="danger" onclick="setConfirm('block')">Frage dauerhaft sperren</button>`;
  }
  if (st !== 'finished') {
    if (ui.confirm === 'end') panels += `<div class="card"><b>Spiel für alle beenden?</b>
      <div class="row" style="margin-top:8px"><button class="danger" onclick="A.end()">Ja, beenden</button><button onclick="setConfirm(null)">Abbrechen</button></div></div>`;
    else btns += `<button onclick="setConfirm('end')">Spiel beenden</button>`;
  }
  return `<div class="card admin"><b>Admin</b><div class="row" style="margin-top:8px">${btns}</div>${panels}</div>`;
}

function lobbyView() {
  const share = `<div class="card" style="text-align:center"><div class="muted">Code</div><div class="code">${esc(S.code)}</div>
    <div class="qr">${qrSvg(joinUrl())}</div>
    <div class="muted" style="word-break:break-all">${esc(joinUrl())}</div></div>`;
  const cfg = S.settings;
  const info = `<p class="muted">${cfg.question_count} Fragen · ${cfg.answer_seconds} s · ${cfg.start_points} Startpunkte · Joker pro Frage max. ${cfg.max_jokers_per_question}</p>`;
  if (isTV()) return `<h1>Quiz – Lobby</h1><div class="tvgrid"><div>${share}</div><div><h2>${S.players.length} Spieler</h2>${playersTable(false)}${info}${adminBox()}</div></div>`;
  const m = me();
  return `<h1>Lobby</h1>${share}<h2>${S.players.length} Spieler</h2>${playersTable(true)}${info}
    <div class="row"><button class="${m && m.is_ready ? '' : 'primary'}" onclick="A.ready(${m && m.is_ready ? 'false' : 'true'})">${m && m.is_ready ? 'Doch nicht bereit' : 'Bereit'}</button></div>
    ${adminBox()}${isAdmin() ? '' : '<p class="muted">Warte, bis der Admin das Spiel startet …</p>'}`;
}

const header = () => `<div class="bar"><span>Frage ${S.progress.current} / ${S.progress.total}</span><span id="timer">–</span>
  ${isTV() ? '' : `<span>${M ? M.points : 0} Punkte</span>`}</div>`;
const answeredLine = () => {
  const req = S.players.filter(p => p.required), done = req.filter(p => p.answered);
  return `<span id="answered">${done.length} / ${req.length}</span>`;
};

function answerList(mode) {   // mode: 'pick' | 'locked' | 'reveal'
  const removed = (M && M.jokers_this_question && M.jokers_this_question.fifty_fifty) ? M.jokers_this_question.fifty_fifty.removed : [];
  const sub = M && M.submission;
  return `<div class="answers">${['A', 'B', 'C', 'D'].map(l => {
    let cls = 'ans', dis = '';
    const text = S.question.answers[l];
    if (mode === 'pick') { if (removed.includes(l)) { cls += ' gone'; dis = 'disabled'; } if (ui.answer === l) cls += ' sel'; }
    if (mode === 'locked') { dis = 'disabled'; if (sub && sub.answer === l) cls += ' sel'; }
    if (mode === 'reveal') {
      dis = 'disabled';
      if (l === S.reveal.correct_answer) cls += ' right';
      else if (sub && sub.answer === l || (!sub && ownResult() && ownResult().answer === l)) cls += ' wrong';
    }
    const cnt = mode === 'reveal' ? ` <span class="pill">${S.reveal.distribution[l]}×</span>` : '';
    return `<button class="${cls}" data-l="${l}" ${dis} onclick="pick('${l}')"><b>${l}</b><span>${esc(text)}${cnt}</span></button>`;
  }).join('')}</div>`;
}
const ownResult = () => S.reveal && ID && S.reveal.results.find(r => r.player_id === ID.playerId);

function jokerPanel() {
  const left = M.jokers_left || {}, used = M.jokers_this_question || {};
  const maxQ = S.settings.max_jokers_per_question;
  const usedCount = Object.keys(used).length + (ui.joker ? 1 : 0);
  const gm = used.group_opinion;
  const b = (key, label, kind) => {
    const n = left[key] || 0;
    const dis = n < 1 || (!used[key] && usedCount >= maxQ && !(ui.joker === key)) || !!used[key];
    if (kind === 'instant') return `<button ${dis ? 'disabled' : ''} onclick="A.joker('${key}')">${label} (${n})</button>`;
    return `<button data-jk="${key}" class="${ui.joker === key ? 'primary' : ''}" ${n < 1 || (usedCount >= maxQ && ui.joker !== key) || (key === 'safety_net' && ui.stake === 0) ? 'disabled' : ''} onclick="setJoker('${key}')">${label} (${n})</button>`;
  };
  return `<div class="card"><b>Joker</b> <span class="muted">(max. ${maxQ} pro Frage)</span>
    <div class="row" style="margin-top:6px">${b('fifty_fifty', '50:50', 'instant')}${b('group_opinion', 'Gruppenmeinung', 'instant')}</div>
    <div class="row" style="margin-top:6px">${b('han_solo', 'Han Solo', 'toggle')}${b('safety_net', 'Sicherheitsnetz', 'toggle')}</div>
    ${gm ? `<p>Gruppenmeinung (bisher ${gm.total} Antworten): A ${gm.A} · B ${gm.B} · C ${gm.C} · D ${gm.D}</p>` : ''}
    <p class="muted">Han Solo: +${S.settings.han_solo_bonus} Bonus, wenn nur du richtig liegst (ab ${S.settings.han_solo_min_players} Spielern). Sicherheitsnetz: halber Verlust bei falscher Antwort.</p></div>`;
}

function questionView() {
  const q = S.question;
  if (isTV()) {
    return `${header()}<div class="tvgrid"><div><div class="qtext">${esc(q.text)}</div>${answerList('locked').replace(/ sel/g, '')}</div>
      <div><h2>Geantwortet ${answeredLine()}</h2><table><tbody>${S.players.map(p => `<tr><td>${esc(p.nickname)}</td><td class="num" data-pa="${p.id}">${p.required ? (p.answered ? '✅' : '…') : '0 Punkte'}</td></tr>`).join('')}</tbody></table>${adminBox()}</div></div>`;
  }
  const sub = M.submission;
  if (sub) {
    return `${header()}<div class="qtext">${esc(q.text)}</div>${answerList('locked')}
      <div class="card">Abgegeben: <b>${sub.answer}</b> · Einsatz <b>${sub.stake}</b>${sub.joker ? ` · ${sub.joker === 'han_solo' ? 'Han Solo' : 'Sicherheitsnetz'}` : ''}
      <br><span class="muted">Warte auf die anderen: ${answeredLine()}</span></div>${adminBox()}`;
  }
  const pts = M.points, locked = pts === 0;
  return `${header()}<div class="qtext">${esc(q.text)}</div>${answerList('pick')}
    <div class="card"><b>Einsatz: <span id="stakeVal">${ui.stake}</span></b> <span class="muted">von ${pts}</span>
      ${locked ? '<p class="muted">Du hast keine Punkte – du spielst ohne Einsatz mit.</p>' : `
      <input id="stakeRange" type="range" min="0" max="${pts}" step="1" value="${ui.stake}" oninput="setStake(this.value)">
      <div class="row"><button onclick="setStake(ui.stake-1)">−1</button><button onclick="setStake(ui.stake+1)">+1</button><button onclick="setStake(0)">0</button><button onclick="setStake(${pts})">All-in</button></div>`}
    </div>${jokerPanel()}
    <button class="primary" style="width:100%;padding:14px" onclick="A.submit()">Antwort &amp; Einsatz bestätigen</button>
    <p class="muted">Nach dem Bestätigen kannst du nichts mehr ändern. Geantwortet: ${answeredLine()}</p>${adminBox()}`;
}

function resultsTable() {
  const names = Object.fromEntries(S.players.map(p => [p.id, p.nickname]));
  const rows = S.reveal.results.slice().sort((a, b) => (b.change ?? 0) - (a.change ?? 0));
  const jk = { han_solo: 'Han Solo', safety_net: 'Netz' };
  return `<table><thead><tr><th>Spieler</th><th>Antwort</th><th class="num">Einsatz</th><th class="num">Ergebnis</th></tr></thead><tbody>${rows.map(r => `
    <tr class="${ID && r.player_id === ID.playerId ? 'me' : ''}"><td>${esc(names[r.player_id] || '?')}</td>
    <td>${r.answer || (r.timed_out ? 'Zeit' : '–')}${r.joker ? ` <span class="pill">${jk[r.joker]}</span>` : ''}</td><td class="num">${r.stake}</td>
    <td class="num ${r.change > 0 ? 'pos' : r.change < 0 ? 'neg' : ''}">${r.change > 0 ? '+' : ''}${r.change}${r.bonus ? ` (Bonus ${r.bonus})` : ''}</td></tr>`).join('')}</tbody></table>`;
}
function revealView() {
  const q = S.question, rv = S.reveal;
  const mine = ownResult();
  const own = mine ? `<div class="card"><b class="${mine.change > 0 ? 'pos' : mine.change < 0 ? 'neg' : ''}">${mine.timed_out ? 'Zeit abgelaufen' : mine.correct ? 'Richtig!' : 'Falsch'} · ${mine.change > 0 ? '+' : ''}${mine.change} Punkte</b>
    ${mine.bonus ? `<br>inkl. Han-Solo-Bonus ${mine.bonus}` : ''}</div>` : '';
  const m = me(), required = m && m.required;
  const waiting = S.players.filter(p => p.required && !p.is_ready).length;
  const btn = isTV() ? '' : required
    ? `<button class="${M.is_ready ? '' : 'primary'}" style="width:100%;padding:14px" onclick="A.ready(${M.is_ready ? 'false' : 'true'})">${M.is_ready ? 'Warte … (zurücknehmen)' : 'Weiter'}</button>`
    : '<p class="muted">Du hast 0 Punkte und musst nicht auf „Weiter“ drücken – du kannst trotzdem zuschauen.</p>';
  const body = `<div class="qtext">${esc(q.text)}</div>${answerList('reveal')}
    ${rv.explanation ? `<p class="muted">💡 ${esc(rv.explanation)}</p>` : ''}${own}
    <h3>Ergebnisse</h3>${resultsTable()}<h3>Rangliste</h3>${rankingTable()}`;
  const wait = `<p class="muted">Warten auf ${`<span id="waiting">${waiting}</span>`} Spieler${S.ready_deadline ? ' · automatisch weiter in <span id="timer"></span>' : ''}</p>`;
  if (isTV()) return `<div class="bar"><span>Auflösung ${S.progress.done} / ${S.progress.total}</span><span></span></div>${body}${wait}${adminBox()}`;
  return `<div class="bar"><span>Auflösung ${S.progress.done} / ${S.progress.total}</span><span>${M.points} Punkte</span></div>${body}${btn}${wait}${adminBox()}`;
}

function finishedView() {
  const f = S.final;
  const tl = a => a.map(x => (x > 0 ? '+' : '') + x).join(' ');
  return `<h1>Spiel beendet</h1>${S.final.length && S.final[0].rank === 1 ? `<h2>🏆 ${f.filter(p => p.rank === 1).map(p => esc(p.nickname)).join(' &amp; ')}</h2>` : ''}
  <table><thead><tr><th class="num">#</th><th>Spieler</th><th class="num">Punkte</th><th class="num">Richtig</th></tr></thead><tbody>${f.map(p => `
    <tr class="${ID && p.player_id === ID.playerId ? 'me' : ''}"><td class="num">${p.rank}</td><td>${esc(p.nickname)}</td><td class="num">${p.points}</td><td class="num">${p.correct}/${p.answered}</td></tr>`).join('')}</tbody></table>
  <details><summary>Details</summary><table><thead><tr><th>Spieler</th><th class="num">Bester Gewinn</th><th class="num">Größter Verlust</th><th class="num">Joker</th></tr></thead><tbody>${f.map(p => `
    <tr><td>${esc(p.nickname)}</td><td class="num">${p.best_win ?? '–'}</td><td class="num">${p.worst_loss ?? '–'}</td><td class="num">${p.jokers_used}</td></tr>
    <tr><td colspan="4" class="muted">Verlauf: ${tl(p.timeline)}</td></tr>`).join('')}</tbody></table></details>
  <div class="row" style="margin-top:14px"><button class="primary" onclick="leave()">Zur Startseite</button></div>`;
}

/* ---------- Rendering ---------- */
function viewKey() {
  if (!ID || !S) return 'home';
  const st = S.status;
  if (st === 'lobby') return 'lobby' + JSON.stringify(S.players.map(p => [p.id, p.nickname, p.is_ready])) + isAdmin() + (M ? M.is_ready : '') + S.settings.min_players;
  if (st === 'question_active') return 'q' + S.question.sq_id + (M ? (M.submission ? 's' : 'o') + M.points + JSON.stringify(M.jokers_this_question) + JSON.stringify(M.jokers_left) : 'tv') + ui.confirm;
  if (st === 'reveal') return 'r' + S.question.sq_id + (M ? M.is_ready : '') + ui.confirm + (S.question ? S.players.length : 0);
  return 'f' + st;
}
function render(force) {
  const key = viewKey();
  if (key === lastKey && !force) return live();
  lastKey = key;
  document.body.classList.toggle('tv', !!isTV());
  document.title = S && S.status !== 'finished' ? `Quiz ${S.code}` : 'Quiz';
  const app = $('#app');
  if (!ID || !S) { app.innerHTML = homeView(); if (!pool) loadPool(); return; }
  app.innerHTML = { lobby: lobbyView, question_active: questionView, reveal: revealView, finished: finishedView }[S.status]();
  live();
}
function live() {   // kleine Änderungen ohne komplettes Neuzeichnen (Eingaben bleiben erhalten)
  if (!S) return;
  const a = $('#answered');
  if (a && S.status === 'question_active') { const req = S.players.filter(p => p.required), d = req.filter(p => p.answered); a.textContent = `${d.length} / ${req.length}`; }
  document.querySelectorAll('[data-pa]').forEach(e => { const p = S.players.find(x => x.id === e.dataset.pa); if (p) e.textContent = p.required ? (p.answered ? '✅' : '…') : '0 Punkte'; });
  const w = $('#waiting'); if (w) w.textContent = S.players.filter(p => p.required && !p.is_ready).length;
}
async function loadPool() { try { pool = await rpc('quiz_pool_info'); if (!ID) render(true); } catch {} }
function resume() { const l = loadLast(); if (l) { ID = l; save(); startSync(); } }

/* ---------- Start ---------- */
(function init() {
  if (!CFG.url || CFG.url.includes('DEIN-PROJEKT')) {
    $('#app').innerHTML = '<h1>Quiz</h1><div class="card"><b>Nicht konfiguriert.</b><p>Bitte in <code>config.js</code> die Supabase-URL und den anon-Key eintragen (siehe SETUP.md).</p></div>';
    return;
  }
  ID = loadId();
  const urlCode = new URLSearchParams(location.search).get('code');
  if (!ID && !urlCode) {            // frischer Tab ohne Link: letzte Runde nur anbieten (Button „Fortsetzen“)
    ID = null;
  }
  if (ID) { if (ID.role === 'tv') document.body.classList.add('tv'); startSync(); }
  render(true);
})();
</script>
</body>
</html>
